<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Exact Reference Banner</title>
  <style>
    :root {
      --app-bg: #020205;
      --card-stroke: #393355;
      --download-bg: #24232b;
      --download-ink: #f1eefc;
      --unread-bg: #b8a7ea;
      --unread-ink: #352660;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--app-bg);
      font-family: Manrope, Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 920px;
      height: 420px;
      background: #000;
      overflow: hidden;
    }

    .card {
      position: absolute;
      left: 92px;
      top: 150px;
      width: 768px;
      height: 244px;
      border-radius: 0 34px 0 0;
      border: 2px solid rgba(57, 51, 85, 0.78);
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 28%, rgba(255, 98, 64, 0.8), transparent 18%),
        radial-gradient(circle at 34% 42%, rgba(205, 27, 21, 0.92), transparent 28%),
        linear-gradient(130deg, #1b0708 0%, #631411 42%, #d34225 100%);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.18), transparent 36%),
        radial-gradient(ellipse at 58% 45%, rgba(0, 0, 0, 0.72), transparent 28%);
      pointer-events: none;
    }

    .banner {
      position: absolute;
      left: 72px;
      top: 112px;
      width: 430px;
      height: 112px;
      z-index: 3;
    }

    .downloaded,
    .unread,
    .flag {
      position: absolute;
      top: 0;
    }

    .downloaded {
      left: 112px;
      width: 210px;
      height: 78px;
      display: grid;
      place-items: center;
      padding-left: 22px;
      clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%);
      background: var(--download-bg);
      color: var(--download-ink);
      font-size: 48px;
      font-weight: 500;
      line-height: 1;
    }

    .unread {
      left: 282px;
      width: 164px;
      height: 78px;
      display: grid;
      place-items: center;
      padding-left: 16px;
      border-radius: 0 28px 28px 0;
      clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
      background: var(--unread-bg);
      color: var(--unread-ink);
      font-size: 48px;
      font-weight: 500;
      line-height: 1;
    }

    .flag {
      left: 0;
      top: -6px;
      width: 118px;
      height: 118px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="banner" aria-label="source flag, downloaded chapters, unread chapters">
      <span class="downloaded" aria-label="Downloaded chapters">1</span>
      <span class="unread" aria-label="Unread chapters">1</span>
      <span class="flag" aria-label="English source"></span>
    </div>
    <div class="card" aria-hidden="true"></div>
  </main>
</body>
</html>
