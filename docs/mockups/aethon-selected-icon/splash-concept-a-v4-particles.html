<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aethon Splash - Particles V4</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #efeaff;
        --muted: rgba(239, 234, 255, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: #050506;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(1280px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 40px 0 52px;
      }

      header {
        margin-bottom: 18px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 23px;
        font-weight: 640;
        letter-spacing: -0.04em;
      }

      .lead {
        max-width: 760px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .stage-shell {
        border: 1px solid rgba(239, 234, 255, 0.08);
        border-radius: 30px;
        padding: 14px;
        background: #08080b;
      }

      .splash-stage {
        min-height: min(760px, calc(100vh - 170px));
        border-radius: 22px;
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          linear-gradient(145deg, rgba(13, 12, 22, 0.74), rgba(4, 4, 8, 0.88) 46%, rgba(4, 4, 8, 0.96)),
          linear-gradient(35deg, rgba(43, 35, 76, 0.072), transparent 38%, rgba(112, 96, 176, 0.038) 72%, transparent),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.009) 0 1px, transparent 1px 5px),
          #030306;
        isolation: isolate;
      }

      .splash-stage::before,
      .splash-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .splash-stage::before {
        display: none;
      }

      .splash-stage::after {
        display: none;
      }

      .manual-starfield {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .ambient-star,
      .orbit-star {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--size, 5px);
        height: var(--size, 5px);
        opacity: 0;
        transform-origin: center;
        will-change: transform, opacity;
      }

      .ambient-star {
        left: var(--x, 50%);
        top: var(--y, 50%);
      }

      .star-core,
      .star-ray-x,
      .star-ray-y,
      .star-dust {
        position: absolute;
        pointer-events: none;
      }

      .star-core {
        inset: 35%;
        border-radius: 999px;
        opacity: var(--core, 0.9);
        background:
          radial-gradient(circle at 37% 32%, rgba(255, 255, 255, 0.98) 0 16%, transparent 28%),
          radial-gradient(circle, rgba(246, 242, 255, 0.94), rgba(211, 200, 255, 0.5) 54%, transparent 76%);
      }

      .star-ray-x,
      .star-ray-y {
        opacity: var(--ray, 0.38);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.76) 48%, rgba(205, 192, 255, 0.5) 55%, transparent);
      }

      .star-ray-x {
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        transform: translateY(-50%) scaleX(var(--ray-x, 1));
      }

      .star-ray-y {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        transform: translateX(-50%) scaleY(var(--ray-y, 1));
        background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.78) 48%, rgba(205, 192, 255, 0.5) 55%, transparent);
      }

      .star-dust {
        inset: 22%;
        opacity: var(--dust, 0.08);
        background:
          radial-gradient(circle at 26% 31%, rgba(255, 255, 255, 0.55) 0 0.7px, transparent 1.1px),
          radial-gradient(circle at 73% 61%, rgba(190, 174, 245, 0.36) 0 0.7px, transparent 1.1px);
        background-size: 6px 6px, 9px 9px;
      }

      .corner {
        position: absolute;
        z-index: 8;
        width: 7px;
        height: 7px;
        opacity: 0.18;
      }

      .corner::before,
      .corner::after {
        content: "";
        position: absolute;
        background: rgba(239, 234, 255, 0.7);
      }

      .corner::before {
        width: 7px;
        height: 1px;
      }

      .corner::after {
        width: 1px;
        height: 7px;
      }

      .corner.tl { left: 18px; top: 18px; }
      .corner.tr { right: 18px; top: 18px; transform: rotate(90deg); }
      .corner.br { right: 18px; bottom: 18px; transform: rotate(180deg); }
      .corner.bl { left: 18px; bottom: 18px; transform: rotate(270deg); }

      .identity {
        position: relative;
        z-index: 4;
        width: min(470px, 54vw);
        height: min(470px, 54vw);
        display: grid;
        place-items: center;
        transform: translateY(-64px);
      }

      .aura {
        display: none;
      }

      .brand-mark {
        position: relative;
        z-index: 3;
        width: 68%;
        height: 68%;
        object-fit: contain;
        filter:
          drop-shadow(0 0 12px rgba(218, 209, 255, 0.08))
          drop-shadow(0 0 34px rgba(139, 119, 224, 0.065))
          drop-shadow(0 0 70px rgba(64, 54, 125, 0.05));
        animation:
          markIn 900ms cubic-bezier(0.18, 0.92, 0.2, 1) both,
          markAura 7.5s ease-in-out infinite;
      }

      @keyframes markAura {
        0%,
        100% {
          filter:
            drop-shadow(0 0 9px rgba(218, 209, 255, 0.06))
            drop-shadow(0 0 26px rgba(139, 119, 224, 0.052))
            drop-shadow(0 0 58px rgba(64, 54, 125, 0.04));
        }

        50% {
          filter:
            drop-shadow(0 0 14px rgba(218, 209, 255, 0.095))
            drop-shadow(0 0 40px rgba(139, 119, 224, 0.075))
            drop-shadow(0 0 82px rgba(64, 54, 125, 0.055));
        }
      }

      @keyframes markIn {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(5px);
        }

        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .orbit-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .orbit-layer.back {
        z-index: 2;
      }

      .orbit-layer.front {
        z-index: 4;
      }

      .state-dock {
        position: absolute;
        z-index: 8;
        left: 50%;
        top: calc(50% + 88px);
        transform: translateX(-50%);
        width: min(320px, calc(100% - 96px));
        display: block;
      }

      .state {
        min-height: 34px;
        display: none;
        place-items: center;
        gap: 7px;
        color: rgba(239, 234, 255, 0.3);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: center;
      }

      .splash-stage[data-state="loading"] .state.loading,
      .splash-stage[data-state="idle"] .state.idle,
      .splash-stage[data-state="pin"] .state.pin,
      .splash-stage[data-state="error"] .state.error {
        display: grid;
      }

      .state-value {
        color: rgba(239, 234, 255, 0.72);
        letter-spacing: 0.16em;
      }

      .line {
        height: 1px;
        width: 100%;
        max-width: 240px;
        margin: 0 auto;
        overflow: hidden;
        background: linear-gradient(90deg, transparent, rgba(239, 234, 255, 0.14), transparent);
      }

      .line span {
        display: block;
        width: 46%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(239, 234, 255, 0.78), transparent);
        animation: shimmer 1.55s ease-in-out infinite;
      }

      @keyframes shimmer {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
      }

      .dots i {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: rgba(239, 234, 255, 0.58);
      }

      .error .state-value {
        color: #ffb9c7;
      }

      .error-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .error-actions span {
        color: rgba(239, 234, 255, 0.58);
        text-transform: none;
        letter-spacing: 0.03em;
      }

      .controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .control {
        border: 1px solid rgba(239, 234, 255, 0.14);
        border-radius: 999px;
        padding: 8px 12px;
        color: rgba(239, 234, 255, 0.58);
        background: rgba(12, 12, 15, 0.78);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .control.is-active {
        color: rgba(239, 234, 255, 0.88);
        border-color: rgba(207, 195, 255, 0.36);
        background: rgba(48, 43, 82, 0.55);
      }

      body.is-paused * {
        animation-play-state: paused !important;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Aethon Splash Particles V4</h1>
        <p class="lead">
          Rebuilt particle pass for Concept A, using sparse twinkle, slow drift and depth-based orbitals in the same V4 page.
        </p>
      </header>

      <section class="stage-shell">
        <div class="splash-stage" id="stage" data-state="loading">
          <div class="manual-starfield" id="manual-starfield" aria-hidden="true"></div>
          <i class="corner tl"></i>
          <i class="corner tr"></i>
          <i class="corner br"></i>
          <i class="corner bl"></i>

          <div class="identity" aria-hidden="true">
            <div class="aura"></div>
            <div class="orbit-layer back" id="orbit-back"></div>
            <img class="brand-mark" src="./package/splash/mark.png" alt="" />
            <div class="orbit-layer front" id="orbit-front"></div>
          </div>

          <div class="state-dock" aria-label="Splash states preview">
            <div class="state loading">
              <div class="state-value">Loading</div>
              <div class="line"><span></span></div>
            </div>
            <div class="state idle">
              <div class="state-value">Ready</div>
              <div class="line"></div>
            </div>
            <div class="state pin">
              <div class="state-value">PIN Required</div>
              <div class="dots"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="state error">
              <div class="state-value">Connection Interrupted</div>
              <div class="error-actions"><span>Retry</span><span>Bypass</span></div>
            </div>
          </div>
        </div>
      </section>

      <div class="controls">
        <button class="control is-active" type="button" data-state="loading">Loading</button>
        <button class="control" type="button" data-state="idle">Idle</button>
        <button class="control" type="button" data-state="pin">PIN</button>
        <button class="control" type="button" data-state="error">Error</button>
        <button class="control" type="button" id="pause">Pause Motion</button>
      </div>
    </main>

    <script>
      const stage = document.querySelector("#stage");
      const pause = document.querySelector("#pause");
      const stateButtons = [...document.querySelectorAll(".controls [data-state]")];
      const starfield = document.querySelector("#manual-starfield");
      const orbitBack = document.querySelector("#orbit-back");
      const orbitFront = document.querySelector("#orbit-front");
      const random = mulberry32(0xA37A0E);
      let isPaused = false;
      let lastFrame = 0;

      const ambientStars = [
        ...createAmbientBand(56, { size: [1.2, 3.2], peak: [0.08, 0.3], base: [0, 0.035], life: [10_000, 32_000], drift: [3, 16], ray: [0.18, 0.42] }),
        ...createAmbientBand(22, { size: [3.4, 6.2], peak: [0.14, 0.46], base: [0, 0.025], life: [18_000, 44_000], drift: [5, 24], ray: [0.28, 0.62] }),
        ...createAmbientBand(7, { size: [6.4, 9.4], peak: [0.16, 0.36], base: [0, 0.018], life: [30_000, 62_000], drift: [4, 18], ray: [0.34, 0.72] }),
      ];

      const orbitConfigs = [
        { size: 8.6, rx: 150, ry: 44, tilt: -24, phase: 0.2, speed: 0.00009, depthPhase: 0.6, driftX: 8, driftY: -4, life: 7800, offset: 500, peak: 0.54, minScale: 0.2, maxScale: 1.02, ray: 0.62 },
        { size: 6.2, rx: 76, ry: 158, tilt: 13, phase: 2.5, speed: -0.000069, depthPhase: -0.3, driftX: -7, driftY: 9, life: 12_500, offset: 4200, peak: 0.36, minScale: 0.16, maxScale: 0.72, ray: 0.42 },
        { size: 10.8, rx: 174, ry: 52, tilt: -55, phase: 1.15, speed: 0.000058, depthPhase: 1.5, driftX: 12, driftY: 6, life: 9300, offset: 2100, peak: 0.48, minScale: 0.22, maxScale: 1.12, ray: 0.72 },
        { size: 7.4, rx: 92, ry: 136, tilt: 38, phase: 4.35, speed: -0.000082, depthPhase: 2.2, driftX: -9, driftY: 5, life: 14_200, offset: 8200, peak: 0.4, minScale: 0.18, maxScale: 0.82, ray: 0.5 },
        { size: 4.8, rx: 198, ry: 34, tilt: 17, phase: 5.7, speed: 0.000046, depthPhase: -1.15, driftX: 5, driftY: -9, life: 16_000, offset: 9900, peak: 0.28, minScale: 0.13, maxScale: 0.55, ray: 0.32 },
        { size: 6.8, rx: 61, ry: 176, tilt: -20, phase: 3.25, speed: 0.000078, depthPhase: 2.75, driftX: 12, driftY: 8, life: 10_400, offset: 6600, peak: 0.35, minScale: 0.16, maxScale: 0.74, ray: 0.46 },
        { size: 9.8, rx: 136, ry: 82, tilt: 63, phase: 4.9, speed: -0.000054, depthPhase: -2.2, driftX: -8, driftY: -5, life: 11_800, offset: 1700, peak: 0.45, minScale: 0.2, maxScale: 1, ray: 0.66 },
        { size: 4.2, rx: 208, ry: 60, tilt: -8, phase: 2, speed: 0.000036, depthPhase: 0.1, driftX: -4, driftY: 10, life: 18_500, offset: 12_100, peak: 0.24, minScale: 0.1, maxScale: 0.5, ray: 0.3 },
        { size: 6.4, rx: 118, ry: 112, tilt: -68, phase: 5.05, speed: 0.000064, depthPhase: 1.85, driftX: 8, driftY: -12, life: 10_900, offset: 3400, peak: 0.34, minScale: 0.15, maxScale: 0.7, ray: 0.4 },
        { size: 5.6, rx: 154, ry: 104, tilt: 27, phase: 3.7, speed: -0.000041, depthPhase: -0.9, driftX: -12, driftY: 4, life: 15_300, offset: 10_700, peak: 0.31, minScale: 0.12, maxScale: 0.62, ray: 0.36 },
      ];

      const orbitals = orbitConfigs.map(createOrbitStar);
      ambientStars.forEach(({ element }) => starfield.append(element));

      stateButtons.forEach((button) => {
        button.addEventListener("click", () => {
          stage.dataset.state = button.dataset.state;
          stateButtons.forEach((candidate) => candidate.classList.toggle("is-active", candidate === button));
        });
      });

      pause.addEventListener("click", () => {
        isPaused = !isPaused;
        document.body.classList.toggle("is-paused", isPaused);
        pause.textContent = isPaused ? "Resume Motion" : "Pause Motion";
      });

      requestAnimationFrame(animate);

      function createAmbientBand(count, options) {
        return Array.from({ length: count }, () => {
          const size = randomBetween(...options.size);
          const drift = randomBetween(...options.drift);
          const direction = randomBetween(0, Math.PI * 2);
          const element = createStarElement("ambient-star", size);
          const config = {
            x: randomBetween(4, 96),
            y: randomBetween(6, 93),
            dx: Math.cos(direction) * drift,
            dy: Math.sin(direction) * drift,
            moveDuration: randomBetween(90_000, 240_000),
            moveOffset: randomBetween(0, 240_000),
            life: randomBetween(...options.life),
            offset: randomBetween(0, options.life[1]),
            peak: randomBetween(...options.peak),
            base: randomBetween(...options.base),
            ray: randomBetween(...options.ray),
            spin: randomBetween(-0.00018, 0.00018),
            rotation: randomBetween(-Math.PI, Math.PI),
          };
          element.style.setProperty("--x", `${config.x.toFixed(2)}%`);
          element.style.setProperty("--y", `${config.y.toFixed(2)}%`);
          return { element, config };
        });
      }

      function createOrbitStar(config) {
        const element = createStarElement("orbit-star", config.size);
        orbitBack.append(element);
        return { element, config };
      }

      function createStarElement(className, size) {
        const element = document.createElement("i");
        element.className = className;
        element.style.setProperty("--size", `${size.toFixed(2)}px`);
        element.innerHTML = `
          <span class="star-ray-x"></span>
          <span class="star-ray-y"></span>
          <span class="star-core"></span>
          <span class="star-dust"></span>
        `;
        return element;
      }

      function animate(timestamp) {
        if (!isPaused && timestamp - lastFrame > 32) {
          updateAmbientStars(timestamp);
          updateOrbitStars(timestamp);
          lastFrame = timestamp;
        }
        requestAnimationFrame(animate);
      }

      function updateAmbientStars(timestamp) {
        ambientStars.forEach(({ element, config }) => {
          const move = ((timestamp + config.moveOffset) % config.moveDuration) / config.moveDuration;
          const driftEase = move < 0.82 ? move / 0.82 : 1 - (move - 0.82) / 0.18;
          const x = config.dx * driftEase;
          const y = config.dy * driftEase;
          const life = sparkleLife(timestamp, config.life, config.offset, 0.06, 0.16, 0.42);
          const opacity = config.base + life * config.peak;
          const scale = 0.62 + life * 0.55;
          const rotate = config.rotation + timestamp * config.spin;

          element.style.opacity = opacity.toFixed(3);
          element.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${rotate.toFixed(3)}rad) scale3d(${scale.toFixed(3)}, ${scale.toFixed(3)}, 1)`;
          element.style.setProperty("--core", (0.42 + life * 0.58).toFixed(3));
          element.style.setProperty("--ray", (life * config.ray).toFixed(3));
          element.style.setProperty("--dust", (life * 0.1).toFixed(3));
          element.style.setProperty("--ray-x", (0.55 + life * 0.8).toFixed(3));
          element.style.setProperty("--ray-y", (0.65 + life * 1.05).toFixed(3));
        });
      }

      function updateOrbitStars(timestamp) {
        orbitals.forEach(({ element, config }) => {
          const projected = projectOrbit(config, timestamp);
          const parent = projected.front ? orbitFront : orbitBack;
          if (element.parentElement !== parent) parent.append(element);

          element.style.opacity = projected.opacity.toFixed(3);
          element.style.transform = `translate3d(calc(-50% + ${projected.x.toFixed(2)}px), calc(-50% + ${projected.y.toFixed(2)}px), 0) rotate(${projected.rotate.toFixed(3)}rad) scale3d(${projected.scale.toFixed(3)}, ${projected.scale.toFixed(3)}, 1)`;
          element.style.setProperty("--core", projected.core.toFixed(3));
          element.style.setProperty("--ray", projected.ray.toFixed(3));
          element.style.setProperty("--dust", projected.dust.toFixed(3));
          element.style.setProperty("--ray-x", projected.rayX.toFixed(3));
          element.style.setProperty("--ray-y", projected.rayY.toFixed(3));
        });
      }

      function projectOrbit(config, timestamp) {
        const angle = config.phase + timestamp * config.speed;
        const tilt = (config.tilt * Math.PI) / 180;
        const rx = config.rx * (1 + Math.sin(angle * 1.73 + config.phase) * 0.045);
        const ry = config.ry * (1 + Math.cos(angle * 1.29 - config.depthPhase) * 0.065);
        const localX = Math.cos(angle) * rx + Math.sin(angle * 0.37 + config.phase) * config.driftX;
        const localY = Math.sin(angle) * ry + Math.cos(angle * 0.61 - config.phase) * config.driftY;
        const x = localX * Math.cos(tilt) - localY * Math.sin(tilt);
        const y = localX * Math.sin(tilt) + localY * Math.cos(tilt);
        const depth = clamp(
          Math.sin(angle + config.depthPhase) * 0.74 +
            Math.cos(angle * 1.8 + config.phase) * 0.16 +
            Math.sin(timestamp * 0.000044 + config.depthPhase) * 0.1,
          -1,
          1,
        );
        const depth01 = (depth + 1) / 2;
        const front = depth > -0.06;
        const life = sparkleLife(timestamp, config.life, config.offset, 0.08, 0.12, 0.46);
        const presence = front ? 0.34 + depth01 * 0.66 : 0.04 + depth01 * 0.24;
        const opacity = life * config.peak * presence;
        const scale = (config.minScale + depth01 * (config.maxScale - config.minScale)) * (front ? 1 : 0.68);
        const rotate = angle * 0.62 + tilt + Math.sin(timestamp * 0.00024 + config.phase) * 0.22;
        const material = life * (front ? 1 : 0.44);

        return {
          x,
          y,
          front,
          opacity,
          scale,
          rotate,
          core: 0.34 + material * (front ? 0.58 : 0.26),
          ray: material * config.ray * (front ? 0.78 : 0.28),
          dust: material * 0.12,
          rayX: 0.62 + material * 0.7,
          rayY: 0.72 + material * 1.05,
        };
      }

      function sparkleLife(timestamp, duration, offset, attack, hold, decay) {
        const phase = ((timestamp + offset) % duration) / duration;
        const start = 0.48;
        const local = phase >= start ? phase - start : phase + 1 - start;
        if (local > attack + hold + decay) return 0;
        if (local < attack) return easeOutCubic(local / attack);
        if (local < attack + hold) return 1;
        const release = (local - attack - hold) / decay;
        return Math.pow(1 - release, 1.85);
      }

      function easeOutCubic(value) {
        return 1 - Math.pow(1 - clamp(value, 0, 1), 3);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function randomBetween(min, max) {
        return min + random() * (max - min);
      }

      function mulberry32(seed) {
        return function next() {
          let t = (seed += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
    </script>
  </body>
</html>
