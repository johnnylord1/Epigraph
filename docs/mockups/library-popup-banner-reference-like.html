<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Reference-like Library Banner</title>
  <style>
    :root {
      --bg: #131313;
      --surface: #19181f;
      --dark-top: #343141;
      --dark-bottom: #24222f;
      --dark-edge: #454051;
      --accent-top: #d2c3ff;
      --accent-bottom: #a995e8;
      --accent-ink: #2f245b;
      --text: #f4f1ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(184, 167, 234, 0.08), transparent 36%),
        var(--bg);
      font-family: Manrope, Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .surface {
      width: 280px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 1px solid #292832;
      background: var(--surface);
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .banner {
      position: relative;
      width: 166px;
      height: 48px;
      filter: drop-shadow(0 13px 16px rgba(0, 0, 0, 0.34));
    }

    .downloaded,
    .unread,
    .flag {
      position: absolute;
      top: 0;
    }

    .downloaded {
      left: 48px;
      z-index: 1;
      width: 66px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 15px 0 0 15px;
      border: 1px solid var(--dark-edge);
      background:
        linear-gradient(180deg, var(--dark-top), var(--dark-bottom));
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    }

    .unread {
      left: 108px;
      z-index: 2;
      width: 64px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 0 17px 17px 0;
      border: 1px solid rgba(211, 196, 255, 0.5);
      background:
        linear-gradient(180deg, var(--accent-top), var(--accent-bottom));
      color: var(--accent-ink);
      font-size: 22px;
      font-weight: 750;
      line-height: 1;
      box-shadow:
        0 12px 22px rgba(184, 167, 234, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        inset 0 -1px 0 rgba(53, 38, 96, 0.12);
    }

    .unread::before {
      content: "";
      position: absolute;
      left: -17px;
      top: -1px;
      width: 32px;
      height: 45px;
      border-radius: 13px 0 0 13px;
      background: inherit;
      border-left: 1px solid rgba(211, 196, 255, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      z-index: -1;
    }

    .flag {
      left: 0;
      top: 6px;
      z-index: 3;
      width: 39px;
      height: 39px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
      box-shadow:
        0 9px 14px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <main class="surface">
    <div class="banner" aria-label="source flag, downloaded chapters, unread chapters">
      <span class="downloaded" aria-label="Downloaded chapters">1</span>
      <span class="unread" aria-label="Unread chapters">6</span>
      <span class="flag" aria-label="English source"></span>
    </div>
  </main>
</body>
</html>
