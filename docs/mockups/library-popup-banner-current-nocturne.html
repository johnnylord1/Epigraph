<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Current Nocturne Banner</title>
  <style>
    :root {
      --n-bg: #131313;
      --n-bg-top: #15151a;
      --n-surface-container-low: #1c1b1b;
      --n-surface-container: #201f1f;
      --n-surface-container-high: #2a2a2a;
      --n-primary: #d3c4ff;
      --n-primary-container: #b8a7ea;
      --n-on-primary: #352660;
      --n-on-surface: #e5e2e1;
      --n-on-surface-variant: #cac4d0;
      --n-outline-variant: #48454f;
      --n-line: rgba(202, 196, 208, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top center, rgba(184, 167, 234, 0.08), transparent 34%),
        linear-gradient(180deg, var(--n-bg-top), var(--n-bg));
      color: var(--n-on-surface);
      font-family: Manrope, Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .surface {
      width: 300px;
      height: 128px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(21, 21, 25, 0.72);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .banner {
      display: inline-flex;
      align-items: center;
      isolation: isolate;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.28));
    }

    .flag {
      z-index: 3;
      width: 30px;
      height: 30px;
      margin-right: -5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
      box-shadow:
        0 6px 12px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.26);
    }

    .metric {
      height: 30px;
      min-width: 44px;
      display: grid;
      place-items: center;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .metric.downloaded {
      z-index: 2;
      margin-right: -5px;
      padding-left: 14px;
      border-radius: 0 12px 12px 0;
      background: rgba(32, 31, 31, 0.96);
      color: rgba(229, 226, 225, 0.88);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .metric.unread {
      z-index: 1;
      min-width: 46px;
      border-radius: 0 12px 12px 0;
      background: rgba(184, 167, 234, 0.92);
      color: var(--n-on-primary);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 6px 14px rgba(184, 167, 234, 0.14);
    }
  </style>
</head>
<body>
  <main class="surface">
    <div class="banner" aria-label="source flag, downloaded chapters, unread chapters">
      <span class="flag" aria-label="English source"></span>
      <span class="metric downloaded" aria-label="Downloaded chapters">1</span>
      <span class="metric unread" aria-label="Unread chapters">6</span>
    </div>
  </main>
</body>
</html>
