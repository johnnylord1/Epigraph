<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Library Popup Banner Only</title>
  <style>
    :root {
      --primary: #d3c4ff;
      --primary-container: #b8a7ea;
      --on-primary: #352660;
      --surface: rgba(30, 28, 39, 0.96);
      --surface-low: rgba(22, 21, 28, 0.98);
      --on-surface: #f1eefc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: Inter, "SF Pro Display", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .banner {
      position: relative;
      display: inline-flex;
      align-items: center;
      isolation: isolate;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.28));
    }

    .flag {
      position: relative;
      z-index: 3;
      width: 34px;
      height: 34px;
      margin-right: -6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
      box-shadow:
        0 6px 12px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .metric {
      height: 32px;
      min-width: 48px;
      display: grid;
      place-items: center;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .metric.downloaded {
      z-index: 2;
      margin-right: -6px;
      padding-left: 15px;
      border-radius: 0 11px 11px 0;
      background: linear-gradient(180deg, var(--surface), var(--surface-low));
      color: rgba(241, 238, 252, 0.84);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    }

    .metric.unread {
      z-index: 1;
      min-width: 50px;
      border-radius: 0 12px 12px 0;
      background: linear-gradient(135deg, rgba(184, 167, 234, 0.94), rgba(211, 196, 255, 0.96));
      color: var(--on-primary);
      box-shadow:
        0 8px 16px rgba(184, 167, 234, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 -1px 0 rgba(53, 38, 96, 0.12);
    }
  </style>
</head>
<body>
  <div class="banner" aria-label="Source language, downloaded chapters and unread chapters banner">
    <span class="flag" aria-label="English source"></span>
    <span class="metric downloaded" aria-label="Downloaded chapters">1</span>
    <span class="metric unread" aria-label="Unread chapters">6</span>
  </div>
</body>
</html>
