<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Audited Library Banner</title>
  <style>
    :root {
      --bg: #15151a;
      --download-bg: #2a2933;
      --download-ink: #f1eefc;
      --unread-bg: #b8a7ea;
      --unread-ink: #352660;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: Manrope, Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .banner {
      position: relative;
      width: 214px;
      height: 82px;
    }

    .downloaded {
      position: absolute;
      left: 38px;
      top: 16px;
      z-index: 1;
      width: 116px;
      height: 48px;
      display: grid;
      place-items: center;
      padding-left: 14px;
      border-radius: 0 14px 14px 0;
      background: var(--download-bg);
      color: var(--download-ink);
      font-size: 25px;
      font-weight: 500;
      line-height: 1;
    }

    .unread {
      position: absolute;
      left: 138px;
      top: 16px;
      z-index: 2;
      width: 66px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px 16px 16px 15px;
      background: var(--unread-bg);
      color: var(--unread-ink);
      font-size: 25px;
      font-weight: 500;
      line-height: 1;
    }

    .flag {
      position: absolute;
      left: 8px;
      top: 16px;
      z-index: 3;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
    }
  </style>
</head>
<body>
  <div class="banner" aria-label="Source flag, downloaded chapters, unread chapters">
    <span class="downloaded" aria-label="Downloaded chapters">1</span>
    <span class="unread" aria-label="Unread chapters">1</span>
    <span class="flag" aria-label="English source"></span>
  </div>
</body>
</html>
