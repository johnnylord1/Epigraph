<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aethon Nocturne Connected Flow</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d12;
      --text: #f0edf8;
      --line: rgba(205, 189, 255, 0.42);
      --fill: rgba(205, 189, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(205, 189, 255, 0.22) transparent;
    }

    .stage {
      position: relative;
      width: min(100%, 1680px);
      flex: 0 0 auto;
    }

    .stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
    }

    .hotspot {
      position: absolute;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      border-color: var(--line);
      background: var(--fill);
      transform: translateY(-1px);
      outline: none;
    }

    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.03em;
      color: var(--text);
      background: rgba(15, 17, 24, 0.92);
      border: 1px solid rgba(205, 189, 255, 0.16);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .viewport {
        padding: 8px;
      }

      .hotspot::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <div class="stage">
      <img id="screenShot" alt="Aethon Nocturne screen preview" />
      <div class="hotspots" id="hotspots"></div>
    </div>
  </main>

  <script>
    const screens = {
      home: {
        image: './home.png',
        hotspots: [
          { label: 'Library', target: 'library', x: 1.8, y: 16.2, w: 5.1, h: 4.6 },
          { label: 'Browse', target: 'browse', x: 1.8, y: 22.1, w: 5.1, h: 4.6 },
          { label: 'Downloads', target: 'downloads', x: 1.8, y: 28.0, w: 5.1, h: 4.6 },
          { label: 'Settings', target: 'settings', x: 1.8, y: 33.9, w: 5.1, h: 4.6 },
          { label: 'Continue', target: 'reader', x: 34.5, y: 27.2, w: 17.5, h: 6.2 },
          { label: 'Manga', target: 'series', x: 63.0, y: 34.6, w: 14.2, h: 22.8 },
          { label: 'Novel', target: 'novel', x: 79.0, y: 34.6, w: 14.2, h: 22.8 }
        ]
      },
      library: {
        image: './library-archive.png',
        hotspots: [
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 },
          { label: 'Browse', target: 'browse', x: 1.8, y: 22.0, w: 5.1, h: 4.6 },
          { label: 'Downloads', target: 'downloads', x: 1.8, y: 27.9, w: 5.1, h: 4.6 },
          { label: 'Settings', target: 'settings', x: 1.8, y: 33.8, w: 5.1, h: 4.6 },
          { label: 'Series Detail', target: 'series', x: 17.3, y: 28.8, w: 14.4, h: 28.6 },
          { label: 'Novel Detail', target: 'novel', x: 67.9, y: 28.8, w: 14.4, h: 23.0 },
          { label: 'Reader', target: 'reader', x: 17.3, y: 59.8, w: 14.4, h: 28.6 }
        ]
      },
      browse: {
        image: './browse.png',
        hotspots: [
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 },
          { label: 'Library', target: 'library', x: 1.8, y: 16.1, w: 5.1, h: 4.6 },
          { label: 'Downloads', target: 'downloads', x: 1.8, y: 28.0, w: 5.1, h: 4.6 },
          { label: 'Settings', target: 'settings', x: 1.8, y: 33.9, w: 5.1, h: 4.6 },
          { label: 'Series Result', target: 'series', x: 23.2, y: 39.5, w: 30.0, h: 22.0 },
          { label: 'Novel Result', target: 'novel', x: 56.2, y: 39.5, w: 28.0, h: 22.0 }
        ]
      },
      series: {
        image: './series-detail.png',
        hotspots: [
          { label: 'Back Library', target: 'library', x: 10.3, y: 8.3, w: 13.2, h: 4.6 },
          { label: 'Continue', target: 'reader', x: 35.2, y: 28.5, w: 19.8, h: 6.3 },
          { label: 'Downloads', target: 'downloads', x: 56.8, y: 28.5, w: 11.2, h: 6.3 },
          { label: 'Reader Chapter', target: 'reader', x: 18.2, y: 44.8, w: 62.5, h: 7.4 },
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 }
        ]
      },
      reader: {
        image: './reader.png',
        hotspots: [
          { label: 'Back', target: 'series', x: 2.4, y: 4.2, w: 7.0, h: 4.3 },
          { label: 'Library', target: 'library', x: 11.0, y: 4.2, w: 8.0, h: 4.3 },
          { label: 'Settings', target: 'settings', x: 89.4, y: 4.2, w: 7.1, h: 4.3 },
          { label: 'Novel', target: 'novel', x: 69.0, y: 91.1, w: 10.5, h: 5.0 },
          { label: 'Series', target: 'series', x: 80.6, y: 91.1, w: 10.5, h: 5.0 }
        ]
      },
      novel: {
        image: './novel-detail.png',
        hotspots: [
          { label: 'Back Library', target: 'library', x: 10.4, y: 8.4, w: 13.2, h: 4.6 },
          { label: 'Continue', target: 'reader', x: 33.6, y: 27.8, w: 20.2, h: 6.2 },
          { label: 'Browse', target: 'browse', x: 56.2, y: 27.8, w: 12.4, h: 6.2 },
          { label: 'Section', target: 'reader', x: 19.6, y: 47.0, w: 58.8, h: 8.0 },
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 }
        ]
      },
      downloads: {
        image: './downloads.png',
        hotspots: [
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 },
          { label: 'Library', target: 'library', x: 1.8, y: 16.1, w: 5.1, h: 4.6 },
          { label: 'Series', target: 'series', x: 22.0, y: 30.5, w: 57.0, h: 8.6 },
          { label: 'Settings', target: 'settings', x: 1.8, y: 33.9, w: 5.1, h: 4.6 }
        ]
      },
      settings: {
        image: './settings.png',
        hotspots: [
          { label: 'Home', target: 'home', x: 1.8, y: 10.2, w: 5.1, h: 4.6 },
          { label: 'Library', target: 'library', x: 1.8, y: 16.1, w: 5.1, h: 4.6 },
          { label: 'Downloads', target: 'downloads', x: 1.8, y: 28.0, w: 5.1, h: 4.6 },
          { label: 'Reader', target: 'reader', x: 52.5, y: 58.0, w: 24.5, h: 13.8 },
          { label: 'Theme Preview', target: 'library', x: 52.5, y: 41.0, w: 24.5, h: 13.8 }
        ]
      }
    };

    const screenShot = document.getElementById('screenShot');
    const hotspots = document.getElementById('hotspots');

    function renderHotspots(key) {
      hotspots.innerHTML = '';
      (screens[key].hotspots || []).forEach((spot) => {
        const button = document.createElement('button');
        button.className = 'hotspot';
        button.type = 'button';
        button.dataset.label = spot.label;
        button.style.left = `${spot.x}%`;
        button.style.top = `${spot.y}%`;
        button.style.width = `${spot.w}%`;
        button.style.height = `${spot.h}%`;
        button.setAttribute('aria-label', spot.label);
        button.addEventListener('click', () => navigate(spot.target));
        hotspots.appendChild(button);
      });
    }

    function navigate(key) {
      const screen = screens[key] || screens.library;
      location.hash = key;
      screenShot.src = screen.image;
      renderHotspots(key);
    }

    window.addEventListener('hashchange', () => {
      navigate(location.hash.replace('#', '') || 'library');
    });

    navigate(location.hash.replace('#', '') || 'library');
  </script>
</body>
</html>
