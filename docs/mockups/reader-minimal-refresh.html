<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aethon Minimal Reader Refresh</title>
    <link rel="stylesheet" href="./reader-minimal-refresh.css" />
  </head>
  <body>
    <div class="review-strip">
      <p class="eyebrow">Aethon / Minimal reader pass</p>
      <div class="reference-strip">
        <a href="https://mihon.app/docs/guides/categories" target="_blank" rel="noreferrer">Mihon categories</a>
        <a href="https://guides.panels.app/misc/sync-reading-sessions" target="_blank" rel="noreferrer">Panels reading now</a>
        <a href="https://www.viz.com/apps" target="_blank" rel="noreferrer">Shonen Jump</a>
      </div>
    </div>

    <div class="app-shell">
      <aside class="rail">
        <div class="brand">
          <div class="brand-mark-wrap">
            <img src="../../src/assets/aethon-icon.svg" alt="Aethon mark" class="brand-mark" />
          </div>
          <span>Aethon</span>
        </div>

        <nav class="rail-nav" aria-label="Main navigation">
          <button type="button" class="rail-button rail-button-active" data-view="dashboard">
            <span class="rail-code">HM</span>
            <small>Home</small>
          </button>
          <button type="button" class="rail-button" data-view="library">
            <span class="rail-code">LB</span>
            <small>Library</small>
          </button>
          <button type="button" class="rail-button" data-view="reader">
            <span class="rail-code">RD</span>
            <small>Reader</small>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <section class="view view-active" data-view-panel="dashboard">
          <header class="view-header">
            <div>
              <p class="micro-label">Home</p>
              <h1>Continue reading</h1>
            </div>
          </header>

          <div class="dashboard-grid">
            <article id="current-panel" class="panel current-panel"></article>
            <aside class="panel updates-panel">
              <div class="panel-head">
                <h2>Updates</h2>
              </div>
              <div id="updates-list" class="updates-list"></div>
            </aside>

            <section class="shelf-block">
              <div class="block-head">
                <h2>Up next</h2>
              </div>
              <div id="queue-shelf" class="shelf-grid"></div>
            </section>

            <section class="shelf-block">
              <div class="block-head">
                <h2>Finished</h2>
              </div>
              <div id="finished-shelf" class="shelf-grid finished-grid"></div>
            </section>
          </div>
        </section>

        <section class="view" data-view-panel="library" hidden>
          <header class="view-header library-header">
            <div>
              <p class="micro-label">Library</p>
              <h1 id="library-title">All titles</h1>
            </div>

            <div class="library-tools">
              <div class="search-pill">Search library</div>
              <div class="segmented-control" aria-label="Library layout">
                <button type="button" class="segment-button segment-button-active" data-card-view="covers">Covers</button>
                <button type="button" class="segment-button" data-card-view="compact">Compact</button>
                <button type="button" class="segment-button" data-card-view="list">List</button>
              </div>
            </div>
          </header>

          <div class="library-bar">
            <div class="category-tabs" aria-label="Library categories">
              <button type="button" class="category-button category-button-active" data-filter="all">All</button>
              <button type="button" class="category-button" data-filter="reading">Reading</button>
              <button type="button" class="category-button" data-filter="upnext">Updates</button>
              <button type="button" class="category-button" data-filter="finished">Finished</button>
              <button type="button" class="category-button" data-filter="offline">Offline</button>
            </div>
            <span id="library-count" class="count-pill">0 titles</span>
          </div>

          <section id="library-grid" class="library-grid" data-card-view="covers"></section>
        </section>

        <section class="view" data-view-panel="reader" hidden>
          <header class="reader-header">
            <div class="reader-heading">
              <button type="button" class="quiet-button" data-view="dashboard">Back</button>
              <div>
                <p class="micro-label">Reader</p>
                <h1 id="reader-series-title">The Horizon</h1>
                <span id="reader-series-meta" class="reader-meta">Ch. 12 - Page 18 / 26</span>
              </div>
            </div>

            <div class="segmented-control" aria-label="Reader mode">
              <button type="button" class="segment-button segment-button-active" data-reader-mode="paged">Paged</button>
              <button type="button" class="segment-button" data-reader-mode="vertical">Vertical</button>
              <button type="button" class="segment-button" data-reader-mode="focus">Focus</button>
            </div>
          </header>

          <div id="reader-layout" class="reader-layout" data-reader-mode="paged">
            <aside class="panel chapter-panel">
              <div id="chapter-list" class="chapter-list"></div>
            </aside>

            <main class="reader-stage">
              <article id="page-sheet" class="page-sheet">
                <div class="page-ribbon">
                  <span id="stage-series-label">The Horizon</span>
                  <span id="stage-page-label">Page 18 / 26</span>
                </div>
                <div class="page-stack">
                  <div class="page-panel page-panel-wide"></div>
                  <div class="page-row">
                    <div class="page-panel page-panel-left"></div>
                    <div class="page-panel page-panel-right"></div>
                  </div>
                </div>
              </article>

              <aside class="floating-tools">
                <label class="tool-control">
                  <span>Brightness</span>
                  <strong id="brightness-value">82%</strong>
                  <input id="brightness-range" class="tool-range" type="range" min="40" max="100" value="82" />
                </label>

                <label class="tool-control">
                  <span>Progress</span>
                  <strong id="progress-value">18 / 26</strong>
                  <input id="progress-range" class="tool-range" type="range" min="1" max="26" value="18" />
                </label>
              </aside>
            </main>
          </div>

          <footer class="reader-footer">
            <div class="reader-progress">
              <span id="footer-page-label">Page 18 / 26</span>
              <div class="progress-track">
                <div id="footer-progress-fill" class="progress-fill"></div>
              </div>
            </div>
            <div class="footer-actions">
              <button type="button" class="quiet-button" data-step="-1">Prev</button>
              <button type="button" class="quiet-button" data-step="1">Next</button>
            </div>
          </footer>
        </section>
      </main>
    </div>

    <script src="./reader-minimal-refresh.js"></script>
  </body>
</html>
