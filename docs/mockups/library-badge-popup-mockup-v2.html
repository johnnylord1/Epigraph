<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Library Popup Badge V2</title>
  <style>
    :root {
      --bg: #131313;
      --bg-top: #15151a;
      --surface: #1c1b1b;
      --surface-glass: rgba(36, 33, 43, 0.92);
      --primary: #d3c4ff;
      --primary-container: #b8a7ea;
      --on-primary: #352660;
      --on-surface: #e5e2e1;
      --on-surface-variant: #cac4d0;
      --line: rgba(202, 196, 208, 0.08);
      --line-strong: rgba(202, 196, 208, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(184, 167, 234, 0.08), transparent 38%),
        linear-gradient(180deg, var(--bg-top), var(--bg));
      font-family: Manrope, Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--on-surface);
    }

    .stage {
      width: 560px;
      height: 360px;
      display: grid;
      place-items: center;
      background: #111115;
    }

    .card {
      position: relative;
      width: 254px;
      padding: 0 0 12px;
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      background: rgba(28, 27, 27, 0.88);
      box-shadow:
        0 20px 52px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .cover {
      position: relative;
      height: 312px;
      overflow: visible;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      background:
        linear-gradient(180deg, transparent 46%, rgba(0, 0, 0, 0.45)),
        radial-gradient(circle at 65% 20%, rgba(255, 203, 126, 0.32), transparent 16%),
        radial-gradient(circle at 38% 55%, rgba(197, 85, 73, 0.28), transparent 24%),
        linear-gradient(135deg, #17131f 0%, #352943 35%, #65445a 58%, #c87958 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.08), transparent 22%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.024) 0 1px, transparent 1px 8px);
      opacity: 0.62;
      pointer-events: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      left: 68px;
      bottom: 56px;
      width: 96px;
      height: 126px;
      border-radius: 48px 48px 24px 24px;
      background:
        radial-gradient(circle at 42% 18%, #17131a 0 30%, transparent 31%),
        linear-gradient(180deg, #21192b 0%, #17131d 100%);
      transform: rotate(-7deg);
      box-shadow:
        28px 22px 0 -12px rgba(22, 17, 25, 0.72),
        0 18px 24px rgba(0, 0, 0, 0.2);
      opacity: 0.86;
    }

    .badge-stack {
      position: absolute;
      z-index: 4;
      top: -15px;
      left: 15px;
      display: flex;
      align-items: center;
      filter:
        drop-shadow(0 10px 16px rgba(0, 0, 0, 0.34))
        drop-shadow(0 1px 0 rgba(255, 255, 255, 0.04));
    }

    .flag {
      position: relative;
      z-index: 3;
      width: 36px;
      height: 36px;
      margin-right: -7px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(90deg, transparent 43%, #f5efff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f5efff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f5efff 40% 48%, #c94c63 48% 54%, #f5efff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f5efff 40% 48%, #c94c63 48% 54%, #f5efff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
      box-shadow:
        0 8px 16px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .metric {
      height: 34px;
      min-width: 52px;
      display: grid;
      place-items: center;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .metric.downloaded {
      z-index: 2;
      margin-right: -7px;
      padding-left: 17px;
      border-radius: 0 13px 13px 0;
      background:
        linear-gradient(180deg, rgba(48, 45, 58, 0.96), rgba(31, 29, 39, 0.98));
      color: rgba(241, 238, 252, 0.88);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
    }

    .metric.unread {
      z-index: 1;
      min-width: 55px;
      border-radius: 0 14px 14px 0;
      background: linear-gradient(135deg, var(--primary-container), var(--primary));
      color: var(--on-primary);
      box-shadow:
        0 10px 22px rgba(184, 167, 234, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .info {
      padding: 10px 12px 0;
    }

    .title {
      margin: 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    .meta {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      align-items: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 8px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip {
      height: 18px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 7px;
      background: var(--surface-glass);
      border: 1px solid rgba(184, 167, 234, 0.12);
      color: rgba(211, 196, 255, 0.82);
    }
  </style>
</head>
<body>
  <main class="stage">
    <article class="card" aria-label="Library card popup badge mockup">
      <div class="cover">
        <div class="badge-stack" aria-label="English source, one downloaded chapter, six unread chapters">
          <span class="flag"></span>
          <span class="metric downloaded">1</span>
          <span class="metric unread">6</span>
        </div>
      </div>
      <div class="info">
        <h1 class="title">A Returner’s Magic</h1>
        <div class="meta">
          <span class="chip">Manhwa</span>
          <span>p.18</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
