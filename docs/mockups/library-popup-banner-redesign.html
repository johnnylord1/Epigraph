<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aethon Library Banner Redesign</title>
  <style>
    :root {
      --app-bg: #131313;
      --app-bg-top: #15151a;
      --surface: #17171c;
      --banner-dark: #24232b;
      --banner-dark-raised: #2d2b36;
      --banner-stroke: #393642;
      --banner-light: #b8a7ea;
      --banner-light-top: #cfc0ff;
      --banner-light-ink: #352660;
      --text: #f1eefc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top center, rgba(184, 167, 234, 0.08), transparent 34%),
        linear-gradient(180deg, var(--app-bg-top), var(--app-bg));
      font-family: Inter, Manrope, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .preview-surface {
      width: 300px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 1px solid #292832;
      background: var(--surface);
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .banner {
      height: 36px;
      display: inline-grid;
      grid-template-columns: 40px 48px 52px;
      align-items: stretch;
      border-radius: 999px;
      background: var(--banner-dark);
      border: 1px solid var(--banner-stroke);
      box-shadow:
        0 10px 18px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .flag-cell,
    .metric {
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .flag-cell {
      position: relative;
      background: var(--banner-dark-raised);
      border-right: 1px solid #383642;
    }

    .flag {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(90deg, transparent 43%, #f4f0ff 43% 57%, transparent 57%),
        linear-gradient(0deg, transparent 42%, #f4f0ff 42% 58%, transparent 58%),
        linear-gradient(34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(-34deg, transparent 40%, #f4f0ff 40% 48%, #c94c63 48% 54%, #f4f0ff 54% 62%, transparent 62%),
        linear-gradient(90deg, transparent 47%, #c94c63 47% 53%, transparent 53%),
        linear-gradient(0deg, transparent 46%, #c94c63 46% 54%, transparent 54%),
        #26335e;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .metric {
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: 0;
    }

    .metric.downloaded {
      background: var(--banner-dark);
      border-right: 1px solid #383642;
    }

    .metric.unread {
      color: var(--banner-light-ink);
      background: linear-gradient(180deg, var(--banner-light-top), var(--banner-light));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
  </style>
</head>
<body>
  <main class="preview-surface">
    <div class="banner" aria-label="Source flag, downloaded chapters, unread chapters">
      <span class="flag-cell" aria-label="English source">
        <span class="flag"></span>
      </span>
      <span class="metric downloaded" aria-label="Downloaded chapters">1</span>
      <span class="metric unread" aria-label="Unread chapters">6</span>
    </div>
  </main>
</body>
</html>
