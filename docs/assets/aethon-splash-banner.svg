<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Aethon animated splash banner">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#c7b1ff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#7f5fe8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#08070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16121f"/>
      <stop offset="1" stop-color="#08070d"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin: 50% 44%; }
      .drift { animation: drift 7s ease-in-out infinite alternate; }
      @keyframes pulse { 0%,100% { opacity:.65; transform:scale(.96); } 50% { opacity:1; transform:scale(1.05); } }
      @keyframes drift { from { transform:translateX(-18px); } to { transform:translateX(18px); } }
    </style>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <circle class="pulse" cx="800" cy="190" r="210" fill="url(#glow)"/>
  <circle class="drift" cx="650" cy="175" r="92" fill="#c7b1ff" opacity="0.12"/>
  <circle class="drift" cx="950" cy="205" r="126" fill="#7f5fe8" opacity="0.10"/>
  <path class="pulse" d="M800 78 C748 145 728 197 728 248 C728 314 780 346 800 346 C820 346 872 314 872 248 C872 197 852 145 800 78 Z" fill="none" stroke="#c7b1ff" stroke-width="10" opacity="0.42"/>
  <rect x="0" y="0" width="1600" height="420" rx="28" fill="#08070d" opacity="0.22"/>
  <text x="800" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="700" fill="#f5f3fa">Aethon</text>
  <text x="800" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#b8b0c8">Desktop reader, source manager and safe Suwayomi runtime shell</text>
  <text x="800" y="304" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#c7b1ff" opacity="0.82">LIBRARY / READER / TTS / MASS MIGRATION / UPDATER</text>
</svg>
