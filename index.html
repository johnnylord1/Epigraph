<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aethon</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(145deg, rgba(13, 12, 22, 0.74), rgba(4, 4, 8, 0.88) 46%, rgba(4, 4, 8, 0.96)),
          linear-gradient(35deg, rgba(43, 35, 76, 0.072), transparent 38%, rgba(112, 96, 176, 0.038) 72%, transparent),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.009) 0 1px, transparent 1px 5px),
          #030306;
      }

      body {
        color: rgba(239, 234, 255, 0.88);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background:
          linear-gradient(145deg, rgba(13, 12, 22, 0.74), rgba(4, 4, 8, 0.88) 46%, rgba(4, 4, 8, 0.96)),
          linear-gradient(35deg, rgba(43, 35, 76, 0.072), transparent 38%, rgba(112, 96, 176, 0.038) 72%, transparent),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.009) 0 1px, transparent 1px 5px),
          #030306;
        opacity: 1;
        transition: opacity 180ms ease;
        pointer-events: none;
      }

      #boot-splash.boot-splash--gone {
        opacity: 0;
      }

      .boot-splash__stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .boot-splash__identity {
        position: relative;
        width: min(470px, 54vw);
        height: min(470px, 54vw);
        display: grid;
        place-items: center;
        transform: translateY(-64px);
      }

      .boot-splash__mark {
        width: 68%;
        height: 68%;
        object-fit: contain;
        filter:
          drop-shadow(0 0 12px rgba(218, 209, 255, 0.08))
          drop-shadow(0 0 34px rgba(139, 119, 224, 0.065))
          drop-shadow(0 0 70px rgba(64, 54, 125, 0.05));
      }

      .boot-splash__dock {
        position: absolute;
        left: 50%;
        top: calc(50% + 88px);
        transform: translateX(-50%);
        width: min(320px, calc(100% - 96px));
        display: grid;
        place-items: center;
        gap: 7px;
        color: rgba(239, 234, 255, 0.3);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: center;
      }

      .boot-splash__value {
        color: rgba(239, 234, 255, 0.72);
        letter-spacing: 0.16em;
      }

      .boot-splash__line {
        height: 1px;
        width: 100%;
        max-width: 240px;
        overflow: hidden;
        background: linear-gradient(90deg, transparent, rgba(239, 234, 255, 0.14), transparent);
      }

      .boot-splash__line::after {
        content: "";
        display: block;
        width: 46%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(239, 234, 255, 0.78), transparent);
        animation: boot-splash-shimmer 1.55s ease-in-out infinite;
      }

      .boot-splash__corner {
        position: absolute;
        width: 7px;
        height: 7px;
        opacity: 0.18;
      }

      .boot-splash__corner::before,
      .boot-splash__corner::after {
        content: "";
        position: absolute;
        background: rgba(239, 234, 255, 0.7);
      }

      .boot-splash__corner::before {
        width: 7px;
        height: 1px;
      }

      .boot-splash__corner::after {
        width: 1px;
        height: 7px;
      }

      .boot-splash__corner--tl { left: 18px; top: 18px; }
      .boot-splash__corner--tr { right: 18px; top: 18px; transform: rotate(90deg); }
      .boot-splash__corner--br { right: 18px; bottom: 18px; transform: rotate(180deg); }
      .boot-splash__corner--bl { left: 18px; bottom: 18px; transform: rotate(270deg); }

      @keyframes boot-splash-shimmer {
        from { transform: translateX(-110%); }
        to { transform: translateX(250%); }
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__stage">
        <i class="boot-splash__corner boot-splash__corner--tl"></i>
        <i class="boot-splash__corner boot-splash__corner--tr"></i>
        <i class="boot-splash__corner boot-splash__corner--br"></i>
        <i class="boot-splash__corner boot-splash__corner--bl"></i>
        <div class="boot-splash__identity">
          <img class="boot-splash__mark" src="/src/assets/aethon-splash-mark.png" alt="" />
        </div>
        <div class="boot-splash__dock">
          <div class="boot-splash__value">Initializing profile</div>
          <div class="boot-splash__line"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (() => {
        const bootSplash = document.getElementById("boot-splash");
        if (!bootSplash) return;

        let dismissed = false;
        let fallbackTimer = null;
        let observer = null;

        const dismiss = () => {
          if (dismissed) return;
          dismissed = true;
          if (fallbackTimer !== null) {
            window.clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }
          if (observer) {
            observer.disconnect();
            observer = null;
          }
          bootSplash.classList.add("boot-splash--gone");
          window.setTimeout(() => bootSplash.remove(), 220);
        };

        const checkForAppShell = () => {
          if (dismissed) return;
          if (document.getElementById("app-shell")) {
            dismiss();
          }
        };

        if ("MutationObserver" in window) {
          observer = new MutationObserver(() => checkForAppShell());
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        }

        window.addEventListener("aethon:boot-ready", checkForAppShell, { once: true });
        checkForAppShell();
        fallbackTimer = window.setTimeout(dismiss, 30000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
