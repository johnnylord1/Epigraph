<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Pair with Epigraph</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --accent: #3d5afe; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe8; --muted: #a19e97; --accent: #8c9eff; --on-accent: #10132b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 22rem; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a.button { display: inline-block; padding: .8rem 1.6rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Pair with Epigraph</h1>
  <div id="ready" hidden>
    <p>Open the Epigraph app on this phone to finish pairing with your desktop.</p>
    <a class="button" id="open" href="#">Open in Epigraph</a>
  </div>
  <p id="invalid">This pairing link is incomplete. Scan the QR code on your desktop again.</p>
</main>
<script>
  // The pairing bundle travels in the fragment, which browsers never send to this server. It is
  // removed from the address bar and history right away and only handed to the Epigraph app.
  (function () {
    var data = location.hash.slice(1);
    history.replaceState(null, "", location.pathname);
    if (!/^[A-Za-z0-9_-]{16,4096}$/.test(data)) return;
    var fallback = "https://github.com/johnnylord1/Epigraph/releases";
    var app = "epigraph://pair?b=" + data;
    var android = /Android/i.test(navigator.userAgent);
    document.getElementById("open").href = android
      ? "intent://pair?b=" + data + "#Intent;scheme=epigraph;S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end"
      : app;
    document.getElementById("invalid").hidden = true;
    document.getElementById("ready").hidden = false;
  })();
</script>
</body>
</html>
