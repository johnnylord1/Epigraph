<style>
  :root {
    color-scheme: dark;
    --sky-deep: #06070d;
    --sky-mid: #0c0e1a;
    --ink-bright: #f2f1f7;
    --ink-soft: #9698ae;
    --ink-dim: #666980;
    --starlight: #c8b6ff;
    --starlight-bright: #e6dcff;
    --hairline: rgba(214, 210, 240, 0.12);
    --hairline-strong: rgba(214, 210, 240, 0.24);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html {
    background: var(--sky-deep);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 85% 55% at 50% -10%, rgba(72, 62, 132, 0.24), transparent 70%),
      radial-gradient(ellipse 60% 45% at 85% 18%, rgba(126, 98, 214, 0.14), transparent 68%),
      radial-gradient(ellipse 70% 60% at 15% 85%, rgba(44, 52, 108, 0.14), transparent 72%),
      linear-gradient(180deg, var(--sky-mid) 0%, var(--sky-deep) 55%, #04050a 100%);
    color: var(--ink-bright);
    font: 400 15px/1.55 "Outfit", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow-x: hidden;
  }

  #starfield {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle ambient glow layer for depth without clutter */
  .sky-veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(circle at 50% 0%, rgba(200, 182, 255, 0.045), transparent 52%),
      radial-gradient(circle at 50% 100%, rgba(6, 7, 13, 0.55), transparent 60%);
  }

  .shell {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(28px, 4.5vw, 56px) clamp(20px, 4vw, 48px) clamp(56px, 8vw, 96px);
    display: flex;
    flex-direction: column;
    gap: clamp(32px, 4vw, 48px);
  }

  /* Open editorial header — zero box, zero card */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px 32px;
    padding-bottom: clamp(24px, 3vw, 34px);
    border-bottom: 1px solid transparent;
    border-image: linear-gradient(90deg, var(--hairline-strong) 0%, var(--hairline) 65%, transparent 100%) 1;
    opacity: 0;
    transform: translateY(10px);
    animation: revealUp 700ms var(--ease-out-expo) forwards;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 220px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 30px;
    height: 32px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 0 14px rgba(196, 178, 255, 0.38));
    transition: transform 500ms var(--ease-out-expo), filter 500ms var(--ease-out-expo);
  }

  .brand-row:hover .brand-mark {
    transform: rotate(-6deg) scale(1.06);
    filter: drop-shadow(0 0 22px rgba(208, 192, 255, 0.65));
  }

  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 3vw, 2.45rem);
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.015em;
    color: var(--ink-bright);
  }

  .subtitle {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.94rem;
    font-weight: 300;
    letter-spacing: 0.005em;
    max-width: 54ch;
  }

  /* Interactive architectural actions — no pills, no heavy boxes */
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 22px;
  }

  a.action-primary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    height: 42px;
    padding: 0 20px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ebe3ff 0%, #cfc0ff 100%);
    color: #130e24;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.45) inset,
      0 8px 28px -8px rgba(200, 182, 255, 0.45);
    transition:
      transform 320ms var(--ease-out-expo),
      box-shadow 360ms var(--ease-out-expo),
      filter 260ms ease;
    will-change: transform;
  }

  a.action-primary::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 22%, rgba(255, 255, 255, 0.58) 50%, transparent 78%);
    transform: translateX(-130%) skewX(-18deg);
    transition: transform 720ms var(--ease-out-expo);
    pointer-events: none;
  }

  a.action-primary:hover {
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 14px 36px -6px rgba(200, 182, 255, 0.62);
    filter: brightness(1.04);
  }

  a.action-primary:hover::before {
    transform: translateX(130%) skewX(-18deg);
  }

  a.action-primary:active {
    transform: scale(0.975) !important;
  }

  a.action-primary svg {
    width: 15px;
    height: 15px;
    transition: transform 340ms var(--ease-out-expo);
  }

  a.action-primary:hover svg {
    transform: translate(2px, -2px);
  }

  a.action-ghost {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 2px;
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-weight: 400;
    text-decoration: none;
    transition: color 260ms var(--ease-smooth), transform 300ms var(--ease-out-expo);
  }

  a.action-ghost::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2px;
    height: 1px;
    background: linear-gradient(90deg, var(--starlight), rgba(200, 182, 255, 0.25));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 420ms var(--ease-out-expo);
  }

  a.action-ghost:hover {
    color: var(--ink-bright);
  }

  a.action-ghost:hover::after {
    transform: scaleX(1);
  }

  a.action-ghost svg {
    width: 15px;
    height: 15px;
    opacity: 0.78;
    transition: transform 340ms var(--ease-out-expo), opacity 240ms ease;
  }

  a.action-ghost:hover svg {
    opacity: 1;
    transform: translateY(1.5px);
  }

  a:focus-visible {
    outline: 2px solid var(--starlight);
    outline-offset: 4px;
    border-radius: 4px;
  }

  /* Open gallery canvas — no outer box */
  .works-canvas {
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .section-bar {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .section-heading {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(1.45rem, 2.2vw, 1.8rem);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink-bright);
  }

  .section-count {
    font-size: 0.84rem;
    font-weight: 300;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 32px 22px;
  }

  /* Open two-column split layout: Comics left (title on top), Books right (title on top) */
  .works-split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(32px, 5vw, 68px);
    align-items: start;
    position: relative;
  }

  .works-split::before {
    content: "";
    position: absolute;
    top: 4px;
    bottom: 8px;
    left: 50%;
    width: 1px;
    background: linear-gradient(
      180deg,
      transparent 0%,
      var(--hairline-strong) 14%,
      var(--hairline) 82%,
      transparent 100%
    );
    pointer-events: none;
  }

  .works-column {
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
  }

  .works-column-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
  }

  .works-column-title {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(1.55rem, 2.3vw, 1.95rem);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--ink-bright);
  }

  .works-column-count {
    font-size: 0.84rem;
    font-weight: 300;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .works-column-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
    gap: 28px 18px;
    align-content: start;
  }

  @media (max-width: 820px) {
    .works-split {
      grid-template-columns: 1fr;
      gap: 44px;
    }
    .works-split::before {
      display: none;
    }
  }

  @media (max-width: 520px) {
    .works-grid,
    .works-column-grid {
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 22px 14px;
    }
  }

  /* Work item — frameless editorial card with tactile 3D hover & light sheen */
  .work-item {
    display: flex;
    flex-direction: column;
    gap: 11px;
    min-width: 0;
    opacity: 0;
    transform: translateY(18px) scale(0.985);
    animation: cardReveal 680ms var(--ease-out-expo) forwards;
    animation-delay: var(--stagger, 0ms);
  }

  .work-cover {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    overflow: hidden;
    display: block;
    text-decoration: none;
    color: var(--ink-bright);
    background: #121320;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 14px 32px -14px rgba(0, 0, 0, 0.78),
      0 4px 12px -4px rgba(0, 0, 0, 0.45);
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px));
    transition:
      transform 420ms var(--ease-out-expo),
      box-shadow 420ms var(--ease-out-expo);
    will-change: transform;
    transform-style: preserve-3d;
  }

  .work-cover.is-tilting {
    transition:
      transform 90ms linear,
      box-shadow 360ms var(--ease-out-expo);
  }

  .work-cover:hover {
    --ty: -5px;
    box-shadow:
      0 0 0 1px rgba(214, 200, 255, 0.34) inset,
      0 26px 48px -14px rgba(0, 0, 0, 0.88),
      0 0 32px -12px rgba(200, 182, 255, 0.32);
  }

  .work-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      circle 220px at var(--mx, 50%) var(--my, 30%),
      rgba(255, 255, 255, 0.2),
      rgba(200, 182, 255, 0.06) 40%,
      transparent 72%
    );
    opacity: 0;
    transition: opacity 320ms ease;
    pointer-events: none;
    z-index: 3;
  }

  .work-cover:hover::after {
    opacity: 1;
  }

  .work-cover-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: transform 620ms var(--ease-out-expo);
    will-change: transform;
  }

  .work-cover:hover .work-cover-stage {
    transform: scale(1.045);
  }

  .work-cover-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .work-monogram {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: 2.35rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    user-select: none;
  }

  .work-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    padding: 0 2px;
  }

  .work-title {
    font-size: 0.91rem;
    font-weight: 500;
    line-height: 1.34;
    color: var(--ink-bright);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
    text-decoration: none;
  }

  a.work-title {
    color: var(--ink-bright);
    transition: color 240ms ease;
  }

  a.work-title span {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    padding-bottom: 1px;
    transition: background-size 380ms var(--ease-out-expo);
  }

  .work-item:hover a.work-title,
  a.work-title:hover {
    color: var(--starlight-bright);
  }

  .work-item:hover a.work-title span,
  a.work-title:hover span {
    background-size: 100% 1px;
  }

  .work-source {
    font-size: 0.77rem;
    font-weight: 300;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 240ms ease;
  }

  .work-item:hover .work-source {
    color: var(--ink-soft);
  }

  /* Invalid / empty state — serene open layout, no card box */
  .empty-state {
    max-width: 30rem;
    margin: clamp(72px, 14vh, 140px) auto 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    opacity: 0;
    transform: translateY(12px);
    animation: revealUp 700ms var(--ease-out-expo) forwards;
  }

  .empty-state p {
    margin: 0 0 6px;
    color: var(--ink-soft);
    font-weight: 300;
  }

  @keyframes revealUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes cardReveal {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .masthead,
    .work-item,
    .empty-state {
      animation: none;
      opacity: 1;
      transform: none;
    }
    .work-cover,
    .work-cover-stage,
    a.action-primary,
    a.action-primary::before,
    a.action-ghost::after,
    .brand-mark {
      transition: none !important;
    }
    .work-cover:hover {
      --ty: 0px;
      transform: none;
    }
    .work-cover:hover .work-cover-stage {
      transform: none;
    }
  }

  [hidden] { display: none !important; }
</style>
</head>

<script>
  // Living starry sky background with gentle depth parallax & rare shooting stars
  (function initStarfield() {
    var canvas = document.getElementById("starfield");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var width = 0, height = 0, dpr = 1;
    var stars = [];
    var meteors = [];
    var targetX = 0, targetY = 0, curX = 0, curY = 0;

    var SPECTRA = [
      [242, 242, 255],
      [212, 200, 255],
      [186, 212, 255],
      [255, 244, 224],
      [196, 182, 255]
    ];

    function seedStars() {
      var area = width * height;
      var count = Math.max(95, Math.min(220, Math.round(area / 6200)));
      stars = [];
      for (var i = 0; i < count; i += 1) {
        var depth = Math.random();
        var tint = SPECTRA[Math.floor(Math.random() * SPECTRA.length)];
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.45 + Math.pow(depth, 1.9) * 1.45,
          depth: 0.25 + depth * 0.95,
          baseAlpha: 0.18 + Math.random() * 0.58,
          twinkleAmp: 0.14 + Math.random() * 0.34,
          twinkleSpeed: 0.00055 + Math.random() * 0.00145,
          phase: Math.random() * Math.PI * 2,
          driftY: 0.005 + depth * 0.013,
          driftX: (Math.random() - 0.5) * 0.006,
          rgb: tint
        });
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seedStars();
      if (reduced) drawFrame(0);
    }

    function spawnMeteor(now) {
      var startX = width * (0.18 + Math.random() * 0.78);
      var startY = height * (0.04 + Math.random() * 0.36);
      var angle = (Math.PI * 0.62) + (Math.random() - 0.5) * 0.22;
      var speed = 0.58 + Math.random() * 0.32;
      meteors.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len: 75 + Math.random() * 65,
        born: now,
        life: 820 + Math.random() * 380
      });
    }

    var nextMeteorAt = performance.now() + 3400 + Math.random() * 4200;

    function drawFrame(now) {
      ctx.clearRect(0, 0, width, height);
      curX += (targetX - curX) * 0.04;
      curY += (targetY - curY) * 0.04;

      for (var i = 0; i < stars.length; i += 1) {
        var s = stars[i];
        if (!reduced) {
          s.y -= s.driftY;
          s.x += s.driftX;
          if (s.y < -4) { s.y = height + 4; s.x = Math.random() * width; }
          if (s.x < -4) s.x = width + 4;
          if (s.x > width + 4) s.x = -4;
        }
        var px = s.x + curX * s.depth * 18;
        var py = s.y + curY * s.depth * 14;
        var twinkle = reduced ? 1 : (0.5 + 0.5 * Math.sin(now * s.twinkleSpeed + s.phase));
        var alpha = Math.min(1, s.baseAlpha + twinkle * s.twinkleAmp);
        var c = s.rgb;

        if (s.r > 1.3) {
          ctx.beginPath();
          ctx.arc(px, py, s.r * 3.1, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (alpha * 0.14).toFixed(3) + ")";
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + alpha.toFixed(3) + ")";
        ctx.fill();
      }

      if (!reduced && now >= nextMeteorAt) {
        spawnMeteor(now);
        nextMeteorAt = now + 7200 + Math.random() * 7800;
      }

      for (var m = meteors.length - 1; m >= 0; m -= 1) {
        var mt = meteors[m];
        var age = now - mt.born;
        if (age >= mt.life) {
          meteors.splice(m, 1);
          continue;
        }
        var t = age / mt.life;
        var headX = mt.x + mt.vx * age;
        var headY = mt.y + mt.vy * age;
        var tailX = headX - mt.vx * mt.len;
        var tailY = headY - mt.vy * mt.len;
        var fade = Math.sin(t * Math.PI);
        var grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
        grad.addColorStop(0, "rgba(240, 234, 255, " + (0.72 * fade).toFixed(3) + ")");
        grad.addColorStop(0.35, "rgba(200, 182, 255, " + (0.28 * fade).toFixed(3) + ")");
        grad.addColorStop(1, "rgba(200, 182, 255, 0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(headX, headY);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      }

      if (!reduced) requestAnimationFrame(drawFrame);
    }

    if (!reduced) {
      window.addEventListener("pointermove", function (e) {
        targetX = (e.clientX / Math.max(1, width) - 0.5) * -1;
        targetY = (e.clientY / Math.max(1, height) - 0.5) * -1;
      }, { passive: true });
    }

    window.addEventListener("resize", resize);
    resize();
    if (!reduced) requestAnimationFrame(drawFrame);
  })();

  // Subtle magnetic pull on primary action buttons
  (function initMagneticButtons() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll("a.action-primary").forEach(function (btn) {
      btn.addEventListener("pointermove", function (e) {
        var rect = btn.getBoundingClientRect();
        var dx = ((e.clientX - rect.left) / rect.width - 0.5) * 6;
        var dy = ((e.clientY - rect.top) / rect.height - 0.5) * 5;
        btn.style.transform = "translate(" + dx.toFixed(2) + "px, " + dy.toFixed(2) + "px)";
      });
      btn.addEventListener("pointerleave", function () {
        btn.style.transform = "";
      });
    });
  })();

  // Share manifest decoder & gallery renderer
  (function () {
    window.addEventListener("hashchange", function () { location.reload(); });
    var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var rawHash = location.hash.slice(1).trim();
    var searchParams = new URLSearchParams(location.search);
    var token = "";
    var imgParam = searchParams.get("img") || "";
    var viewOnly = searchParams.get("view") === "1";

    if (rawHash) {
      var parts = rawHash.split("&");
      token = (parts[0] || "").trim();
      for (var i = 1; i < parts.length; i += 1) {
        var kv = parts[i].split("=");
        if (kv[0] === "img" && kv[1]) imgParam = kv[1].trim();
        if (kv[0] === "view" && kv[1] === "1") viewOnly = true;
      }
    } else {
      token = (searchParams.get("p") || "").trim();
    }

    var tokenRe = /^(d\.[A-Za-z0-9_-]{8,16384}|[lcikpa]\.[A-Za-z0-9_-]{1,64}|u\.[A-Za-z0-9]{1,16}\.[A-Za-z0-9_-]{1,64})$/;
    if (!tokenRe.test(token)) return;

    function resolveHostedUrl(t) {
      if (!t) return null;
      var m = /^([lcikpa])\.([A-Za-z0-9_-]{1,64})$/.exec(t);
      if (m) {
        var p = m[1], id = m[2];
        if (p === "i") return "https://iili.io/" + id + ".png";
        if (p === "k") return "https://kappa.lol/" + id + ".png";
        if (p === "p") return "https://pomf2.lain.la/f/" + id + ".png";
        if (p === "a") return "https://x0.at/" + id + ".png";
        if (p === "l") return "https://litter.catbox.moe/" + id + ".png";
        if (p === "c") return "https://files.catbox.moe/" + id + ".png";
      }
      var u = /^u\.([A-Za-z0-9]{1,16})\.([A-Za-z0-9_-]{1,64})$/.exec(t);
      if (u) return "https://" + u[1] + ".uguu.se/" + u[2] + ".png";
      return null;
    }

    var appUrl = "epigraph://import?p=" + encodeURIComponent(token);
    var android = /Android/i.test(navigator.userAgent);
    var fallback = new URL(location.href);
    fallback.searchParams.set("view", "1");
    var target = android
      ? "intent://import?p=" + encodeURIComponent(token) + "#Intent;scheme=epigraph;S.browser_fallback_url=" + encodeURIComponent(fallback.href) + ";end"
      : appUrl;

    var openEl = document.getElementById("open");
    var statusEl = document.getElementById("status");
    openEl.href = target;
    document.getElementById("invalid").hidden = true;
    document.getElementById("ready").hidden = false;

    var collageUrl = resolveHostedUrl(imgParam) || resolveHostedUrl(token);

    var PALETTES = [
      { bg: "#1c1833", fg: "#e0c2e6" },
      { bg: "#122b25", fg: "#a8d8bd" },
      { bg: "#2e1e1b", fg: "#ecc29e" },
      { bg: "#152536", fg: "#a8d0ef" },
      { bg: "#261a32", fg: "#d6b8f2" },
      { bg: "#242218", fg: "#e2d79c" }
    ];

    function monogramFor(title) {
      var words = (title || "").replace(/[^A-Za-z0-9\u00C0-\u024F]+/g, " ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "?";
      if (words.length === 1) return words[0].slice(0, 2);
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function safeWebUrl(raw) {
      if (typeof raw !== "string" || !raw.trim()) return null;
      try {
        var u = new URL(raw.trim());
        return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
      } catch (_) {
        return null;
      }
    }

    function resolveWorkHref(webUrl, relUrl, srcName) {
      var direct = safeWebUrl(webUrl) || safeWebUrl(relUrl);
      if (direct) return direct;
      var lowerSrc = (srcName || "").toLowerCase();
      if (relUrl && relUrl.charAt(0) === "/") {
        if (lowerSrc.indexOf("mangadex") !== -1) return "https://mangadex.org" + relUrl;
        if (lowerSrc.indexOf("manganato") !== -1 || lowerSrc.indexOf("manganelo") !== -1) return "https://www.natomanga.com" + relUrl;
        if (lowerSrc.indexOf("mangakakalot") !== -1) return "https://www.mangakakalove.com" + relUrl;
      }
      return null;
    }

    function attachCardTilt(coverEl) {
      if (reducedMotion) return;
      coverEl.addEventListener("pointerenter", function () {
        coverEl.classList.add("is-tilting");
      });
      coverEl.addEventListener("pointermove", function (e) {
        var rect = coverEl.getBoundingClientRect();
        var px = (e.clientX - rect.left) / rect.width;
        var py = (e.clientY - rect.top) / rect.height;
        var rx = (0.5 - py) * 9.5;
        var ry = (px - 0.5) * 11;
        coverEl.style.setProperty("--rx", rx.toFixed(2) + "deg");
        coverEl.style.setProperty("--ry", ry.toFixed(2) + "deg");
        coverEl.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
        coverEl.style.setProperty("--my", (py * 100).toFixed(1) + "%");
      });
      coverEl.addEventListener("pointerleave", function () {
        coverEl.classList.remove("is-tilting");
        coverEl.style.removeProperty("--rx");
        coverEl.style.removeProperty("--ry");
        coverEl.style.removeProperty("--mx");
        coverEl.style.removeProperty("--my");
      });
    }

    // Same grid and spacing as sharePayload.ts and LibraryShareCard.kt.
    function shareCollageLayout(count) {
      var total = Math.max(0, Math.floor(count));
      if (total === 0) return { columns: 0, rows: 0, covers: 0, overflow: 0 };
      var cells = Math.min(total, 40);
      var covers = total > cells ? cells - 1 : cells;
      var overflow = total - covers;
      var best = { columns: 1, rows: cells, score: Infinity };
      var cellAspect = 1 / 1.78;
      var targetAspect = 1.3;
      for (var cols = 1; cols <= Math.min(cells, 8); cols += 1) {
        var rows = Math.ceil(cells / cols);
        var empty = rows * cols - cells;
        var aspect = (cols * cellAspect) / rows;
        var score = Math.abs(Math.log(aspect / targetAspect)) + empty * 0.35;
        if (score < best.score) best = { columns: cols, rows: rows, score: score };
      }
      return { columns: best.columns, rows: best.rows, covers: covers, overflow: overflow };
    }

    function cropCoversFromCollage(imgEl, workCount, coverStages) {
      try {
        var layout = shareCollageLayout(workCount);
        if (layout.covers === 0) return;
        var padding = 40, headerHeight = 84, cellWidth = 200, coverHeight = 300;
        var cellHeight = 300 + 12 + 21 * 2;
        var gapX = 24, gapY = 28;
        var gridWidth = layout.columns * cellWidth + (layout.columns - 1) * gapX;
        var baseWidth = padding * 2 + Math.max(gridWidth, 440);
        var scale = imgEl.naturalWidth / baseWidth;
        if (!scale || scale <= 0) return;
        var gridX = (baseWidth - gridWidth) / 2;
        var gridY = padding + headerHeight;

        for (var c = 0; c < layout.covers && c < coverStages.length; c += 1) {
          var targetStage = coverStages[c];
          if (!targetStage || targetStage.dataset.hasDirectCover === "1") continue;
          var x = gridX + (c % layout.columns) * (cellWidth + gapX);
          var y = gridY + Math.floor(c / layout.columns) * (cellHeight + gapY);
          // CSS clipping also works for hosts that allow displaying, but not reading, the PNG.
          var croppedImg = document.createElement("img");
          croppedImg.src = imgEl.src;
          croppedImg.alt = "";
          croppedImg.style.inset = (-100 * y / coverHeight) + "% auto auto " + (-100 * x / cellWidth) + "%";
          croppedImg.style.width = (100 * baseWidth / cellWidth) + "%";
          croppedImg.style.height = (100 * imgEl.naturalHeight / scale / coverHeight) + "%";
          croppedImg.style.maxWidth = "none";
          croppedImg.style.objectFit = "fill";
          targetStage.firstChild.after(croppedImg);
        }
      } catch (_) {}
    }

    function classifyWorkKind(w, srcIdx, relUrl, webUrl) {
      var rawKind = typeof w[5] === "string" ? w[5].trim().toLowerCase() : "";
      if (rawKind === "b" || rawKind === "book") return "book";
      if (rawKind === "c" || rawKind === "comic") return "comic";
      if (srcIdx < 0 && !relUrl && !safeWebUrl(webUrl)) return "book";
      return "comic";
    }

    function renderManifest(manifest) {
      if (!manifest || manifest.v !== 1 || !Array.isArray(manifest.w) || !manifest.w.length) return false;
      var sources = Array.isArray(manifest.s) ? manifest.s : [];
      var works = manifest.w;
      var singleHead = document.getElementById("works-single-head");
      var grid = document.getElementById("works-grid");
      var splitEl = document.getElementById("works-split");
      var comicsGrid = document.getElementById("works-comics-grid");
      var booksGrid = document.getElementById("works-books-grid");
      grid.innerHTML = "";
      comicsGrid.innerHTML = "";
      booksGrid.innerHTML = "";
      var coverStages = [];

      var hasAnyLink = false;
      var hasImportableWork = false;
      var comicItems = [];
      var bookItems = [];
      var allItems = [];
      works.forEach(function (w, idx) {
        if (!Array.isArray(w)) return;
        var srcIdx = typeof w[0] === "number" ? w[0] : -1;
        var relUrl = typeof w[1] === "string" ? w[1] : "";
        var title = typeof w[2] === "string" ? w[2].trim() : "";
        if (!title) return;
        var srcEntry = (srcIdx >= 0 && srcIdx < sources.length && Array.isArray(sources[srcIdx])) ? sources[srcIdx] : null;
        if (srcEntry && /^-?\d{1,20}$/.test(srcEntry[0]) && srcEntry[0] !== "0" && relUrl) hasImportableWork = true;
        var srcName = srcEntry && typeof srcEntry[1] === "string" ? srcEntry[1] : "";
        var href = resolveWorkHref(w[3], relUrl, srcName);
        if (href) hasAnyLink = true;
        var coverUrl = safeWebUrl(w[4]);
        var kind = classifyWorkKind(w, srcIdx, relUrl, w[3]);

        var item = document.createElement("article");
        item.className = "work-item";
        item.style.setProperty("--stagger", Math.min(idx, 18) * 45 + "ms");

        var pal = PALETTES[idx % PALETTES.length];
        var coverEl = document.createElement(href ? "a" : "div");
        coverEl.className = href ? "work-cover" : "work-cover is-static";
        if (href) {
          coverEl.href = href;
          coverEl.target = "_blank";
          coverEl.rel = "noopener noreferrer";
          coverEl.setAttribute("aria-label", title);
        }
        coverEl.title = title;
        attachCardTilt(coverEl);

        var stage = document.createElement("div");
        stage.className = "work-cover-stage";

        var mono = document.createElement("div");
        mono.className = "work-monogram";
        mono.setAttribute("aria-hidden", "true");
        mono.style.background = pal.bg;
        mono.style.color = pal.fg;
        mono.textContent = monogramFor(title);
        stage.appendChild(mono);

        if (coverUrl) {
          var img = document.createElement("img");
          img.src = coverUrl;
          img.alt = "";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          img.onload = function () {
            stage.dataset.hasDirectCover = "1";
          };
          img.onerror = function () {
            img.remove();
          };
          stage.appendChild(img);
        }
        coverStages[idx] = stage;
        coverEl.appendChild(stage);
        item.appendChild(coverEl);

        var meta = document.createElement("div");
        meta.className = "work-meta";
        var link = document.createElement(href ? "a" : "span");
        link.className = href ? "work-title" : "work-title is-static";
        if (href) {
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          var titleSpan = document.createElement("span");
          titleSpan.textContent = title;
          link.appendChild(titleSpan);
        } else {
          link.textContent = title;
        }
        link.title = title;
        meta.appendChild(link);

        var subtitleText = srcName || (!href ? "Local book" : "");
        if (subtitleText) {
          var srcEl = document.createElement("span");
          srcEl.className = "work-source";
          srcEl.textContent = subtitleText;
          meta.appendChild(srcEl);
        }
        item.appendChild(meta);
        allItems.push(item);
        if (kind === "book") {
          bookItems.push(item);
        } else {
          comicItems.push(item);
        }
      });

      var count = allItems.length;
      if (!count) return false;
      var hasBoth = comicItems.length > 0 && bookItems.length > 0;
      if (hasBoth) {
        singleHead.hidden = true;
        grid.hidden = true;
        splitEl.hidden = false;
        document.getElementById("comics-column-count").textContent = String(comicItems.length);
        document.getElementById("books-column-count").textContent = String(bookItems.length);
        comicItems.forEach(function (el) { comicsGrid.appendChild(el); });
        bookItems.forEach(function (el) { booksGrid.appendChild(el); });
      } else {
        singleHead.hidden = false;
        grid.hidden = false;
        splitEl.hidden = true;
        document.getElementById("works-heading").textContent = bookItems.length > 0 ? "Books" : "Comics";
        document.getElementById("works-single-count").textContent = String(count);
        allItems.forEach(function (el) { grid.appendChild(el); });
      }

      var countLabel = count === 1 ? "1 shared work" : (count + " shared works");
      statusEl.textContent = hasAnyLink
        ? (countLabel + " — select any cover or title to open its source")
        : countLabel;

      document.getElementById("works-section").hidden = false;
      openEl.hidden = !hasImportableWork;

      if (collageUrl) {
        var hiddenCollage = new Image();
        hiddenCollage.onload = function () {
          cropCoversFromCollage(hiddenCollage, works.length, coverStages);
        };
        hiddenCollage.src = collageUrl;
      }
      return true;
    }

    async function decodeInlineToken(inlineToken) {
      if (!/^d\.[A-Za-z0-9_-]{8,1400000}$/.test(inlineToken || "") || typeof DecompressionStream === "undefined") return null;
      try {
        var b64 = inlineToken.slice(2).replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4 !== 0) b64 += "=";
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        var inflated = await readLimitedBytes(stream, 1024 * 1024);
        return JSON.parse(new TextDecoder().decode(inflated));
      } catch (_) {
        return null;
      }
    }

    async function readLimitedBytes(stream, maxBytes) {
      var reader = stream.getReader();
      var chunks = [];
      var length = 0;
      try {
        for (;;) {
          var part = await reader.read();
          if (part.done) break;
          length += part.value.length;
          if (length > maxBytes) throw new Error("Shared data exceeds the size limit");
          chunks.push(part.value);
        }
      } finally {
        await reader.cancel();
      }
      var bytes = new Uint8Array(length);
      var offset = 0;
      chunks.forEach(function (chunk) {
        bytes.set(chunk, offset);
        offset += chunk.length;
      });
      return bytes;
    }

    function extractInlineTokenFromPng(bytes) {
      if (!bytes || bytes.length < 33) return null;
      var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      var offset = 8;
      var decoder = new TextDecoder();
      while (offset + 12 <= bytes.length) {
        var len = view.getUint32(offset, false);
        var type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
        var next = offset + 12 + len;
        if (next > bytes.length) return null;
        if (type === "tEXt") {
          var data = bytes.subarray(offset + 8, offset + 8 + len);
          var sep = data.indexOf(0);
          if (sep > 0 && decoder.decode(data.subarray(0, sep)) === "epigraph-share") {
            return decoder.decode(data.subarray(sep + 1)).trim();
          }
        }
        if (type === "IEND") break;
        offset = next;
      }
      return null;
    }

    (async function () {
      var inline = token.indexOf("d.") === 0 ? token : null;
      var manifest = await decodeInlineToken(inline);
      if (!manifest && collageUrl) {
        var controller = new AbortController();
        var timeout = setTimeout(function () { controller.abort(); }, 10000);
        try {
          var resp = await fetch(collageUrl, { signal: controller.signal });
          if (resp.ok && resp.body) {
            var buf = await readLimitedBytes(resp.body, 16 * 1024 * 1024);
            inline = extractInlineTokenFromPng(buf);
            manifest = await decodeInlineToken(inline);
          }
        } catch (_) {
          // A removed or expired image can't provide the embedded list.
        } finally {
          clearTimeout(timeout);
        }
      }
      if (!renderManifest(manifest)) {
        statusEl.textContent = "This shared list is unavailable or has expired.";
        return;
      }
      if (!viewOnly && !openEl.hidden) window.location.href = target;
    })();
  })();
</script>
</body>
