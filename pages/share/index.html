<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Shared Works · Epigraph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0a0e;
    --surface: #15141b;
    --surface-high: #1e1c26;
    --border: rgba(201, 181, 255, 0.14);
    --border-strong: rgba(201, 181, 255, 0.28);
    --fg: #e7e4ee;
    --muted: #9f98ad;
    --accent: #c9b5ff;
    --accent-hover: #d8c9ff;
    --on-accent: #241748;
    --accent-dim: rgba(201, 181, 255, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 "Inter", "Outfit", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .shell {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .hero {
    padding: 20px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 200px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(201, 181, 255, 0.55);
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 120ms ease, border-color 120ms ease;
  }
  a.btn-primary {
    background: var(--accent);
    color: var(--on-accent);
  }
  a.btn-primary:hover { background: var(--accent-hover); }
  a.btn-secondary {
    background: var(--surface-high);
    color: var(--fg);
    border: 1px solid var(--border-strong);
  }
  a.btn-secondary:hover {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .section-card {
    padding: 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-title {
    margin: 0;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--muted);
  }
  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 18px 14px;
  }
  @media (max-width: 520px) {
    .works-grid {
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 14px 10px;
    }
  }
  .work-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .work-cover {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-high);
    display: grid;
    place-items: center;
    text-decoration: none;
    color: var(--fg);
    transition: border-color 120ms ease, transform 120ms ease;
  }
  a.work-cover:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .work-cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .work-monogram {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    user-select: none;
  }
  .work-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  a.work-title,
  span.work-title {
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.34;
    color: var(--fg);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  a.work-title {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(201, 181, 255, 0.45);
    text-underline-offset: 2px;
  }
  a.work-title:hover {
    color: var(--accent-hover);
    text-decoration-color: var(--accent-hover);
  }
  .work-source {
    font-size: 0.76rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .invalid-card {
    max-width: 28rem;
    margin: 48px auto;
    padding: 28px 24px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    text-align: center;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <section id="ready" class="hero" hidden>
    <div class="brand">
      <div class="brand-row">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>Epigraph</h1>
      </div>
      <p id="status" class="subtitle">Opening shared works in Epigraph…</p>
    </div>
    <div class="actions">
      <a class="btn btn-primary" id="open" href="#">Open in Epigraph</a>
      <a class="btn btn-secondary" id="download" href="https://github.com/johnnylord1/Epigraph/releases" target="_blank" rel="noopener noreferrer">Download on GitHub</a>
    </div>
  </section>

  <section id="works-section" class="section-card" hidden>
    <div class="section-head">
      <h2 id="works-heading" class="section-title">Shared works</h2>
    </div>
    <div id="works-grid" class="works-grid"></div>
  </section>

  <section id="invalid" class="invalid-card">
    <h1>Epigraph</h1>
    <p class="subtitle" style="margin: 8px 0 18px;">This shared library link is incomplete or invalid.</p>
    <a class="btn btn-primary" href="https://github.com/johnnylord1/Epigraph/releases">Download on GitHub</a>
  </section>
</div>

<script>
  (function () {
    var rawHash = location.hash.slice(1).trim();
    var searchParams = new URLSearchParams(location.search);
    var token = "";
    var imgParam = searchParams.get("img") || "";
    var viewOnly = searchParams.get("view") === "1";

    if (rawHash) {
      var parts = rawHash.split("&");
      token = (parts[0] || "").trim();
      for (var i = 1; i < parts.length; i += 1) {
        var kv = parts[i].split("=");
        if (kv[0] === "img" && kv[1]) imgParam = decodeURIComponent(kv[1]).trim();
        if (kv[0] === "view" && kv[1] === "1") viewOnly = true;
      }
    } else {
      token = (searchParams.get("p") || "").trim();
    }

    var tokenRe = /^(d\.[A-Za-z0-9_-]{8,16384}|[lcikpa]\.[A-Za-z0-9_-]{1,64}|u\.[A-Za-z0-9]{1,16}\.[A-Za-z0-9_-]{1,64})$/;
    if (!tokenRe.test(token)) return;

    function resolveHostedUrl(t) {
      if (!t) return null;
      var m = /^([lcikpa])\.([A-Za-z0-9_-]{1,64})$/.exec(t);
      if (m) {
        var p = m[1], id = m[2];
        if (p === "i") return "https://iili.io/" + id + ".png";
        if (p === "k") return "https://kappa.lol/" + id + ".png";
        if (p === "p") return "https://pomf2.lain.la/f/" + id + ".png";
        if (p === "a") return "https://x0.at/" + id + ".png";
        if (p === "l") return "https://litter.catbox.moe/" + id + ".png";
        if (p === "c") return "https://files.catbox.moe/" + id + ".png";
      }
      var u = /^u\.([A-Za-z0-9]{1,16})\.([A-Za-z0-9_-]{1,64})$/.exec(t);
      if (u) return "https://" + u[1] + ".uguu.se/" + u[2] + ".png";
      return null;
    }

    var appUrl = "epigraph://import?p=" + encodeURIComponent(token);
    var android = /Android/i.test(navigator.userAgent);
    var target = android
      ? "intent://import?p=" + encodeURIComponent(token) + "#Intent;scheme=epigraph;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end"
      : appUrl;

    var openEl = document.getElementById("open");
    var statusEl = document.getElementById("status");
    openEl.href = target;
    document.getElementById("invalid").hidden = true;
    document.getElementById("ready").hidden = false;

    var collageUrl = resolveHostedUrl(imgParam) || resolveHostedUrl(token);

    var PALETTES = [
      { bg: "#211d3a", fg: "#e5b8d9" },
      { bg: "#17352c", fg: "#b7de9a" },
      { bg: "#37231e", fg: "#f0c39b" },
      { bg: "#1b2c3b", fg: "#a8d2f0" },
      { bg: "#2d1f36", fg: "#d7b5f5" },
      { bg: "#2b291c", fg: "#e6da9c" }
    ];

    function monogramFor(title) {
      var words = (title || "").replace(/[^A-Za-z0-9\u00C0-\u024F]+/g, " ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "?";
      if (words.length === 1) return words[0].slice(0, 2);
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function safeWebUrl(raw) {
      if (typeof raw !== "string" || !raw.trim()) return null;
      try {
        var u = new URL(raw.trim());
        return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
      } catch (_) {
        return null;
      }
    }

    function resolveWorkHref(webUrl, relUrl, srcName, title) {
      var direct = safeWebUrl(webUrl) || safeWebUrl(relUrl);
      if (direct) return direct;
      var lowerSrc = (srcName || "").toLowerCase();
      if (relUrl && relUrl.charAt(0) === "/") {
        if (lowerSrc.indexOf("mangadex") !== -1) return "https://mangadex.org" + relUrl;
        if (lowerSrc.indexOf("manganato") !== -1 || lowerSrc.indexOf("manganelo") !== -1) return "https://www.natomanga.com" + relUrl;
        if (lowerSrc.indexOf("mangakakalot") !== -1) return "https://www.mangakakalove.com" + relUrl;
      }
      var q = encodeURIComponent(((srcName ? srcName + " " : "") + title).trim());
      return "https://www.google.com/search?q=" + q;
    }

    // Exact shareCollageLayout math from sharePayload.ts / LibraryShareCard.kt so we can crop
    // individual cover cards directly from the hosted collage PNG in memory when hotlinking is blocked.
    function shareCollageLayout(count) {
      var total = Math.max(0, Math.floor(count));
      if (total === 0) return { columns: 0, rows: 0, covers: 0, overflow: 0 };
      var cells = Math.min(total, 40);
      var covers = total > cells ? cells - 1 : cells;
      var overflow = total - covers;
      var best = { columns: 1, rows: cells, score: Infinity };
      var cellAspect = 1 / 1.78;
      var targetAspect = 1.3;
      for (var cols = 1; cols <= Math.min(cells, 8); cols += 1) {
        var rows = Math.ceil(cells / cols);
        var empty = rows * cols - cells;
        var aspect = (cols * cellAspect) / rows;
        var score = Math.abs(Math.log(aspect / targetAspect)) + empty * 0.35;
        if (score < best.score) best = { columns: cols, rows: rows, score: score };
      }
      return { columns: best.columns, rows: best.rows, covers: covers, overflow: overflow };
    }

    function cropCoversFromCollage(imgEl, workCount, coverEls) {
      try {
        var layout = shareCollageLayout(workCount);
        if (layout.covers === 0) return;
        var padding = 40, headerHeight = 84, cellWidth = 200, coverHeight = 300;
        var cellHeight = 300 + 12 + 21 * 2;
        var gapX = 24, gapY = 28;
        var gridWidth = layout.columns * cellWidth + (layout.columns - 1) * gapX;
        var baseWidth = padding * 2 + Math.max(gridWidth, 440);
        var scale = imgEl.naturalWidth / baseWidth;
        if (!scale || scale <= 0) return;
        var gridX = (baseWidth - gridWidth) / 2;
        var gridY = padding + headerHeight;

        var canvas = document.createElement("canvas");
        var outW = Math.round(cellWidth * scale);
        var outH = Math.round(coverHeight * scale);
        canvas.width = outW;
        canvas.height = outH;
        var ctx = canvas.getContext("2d");
        if (!ctx) return;

        for (var c = 0; c < layout.covers && c < coverEls.length; c += 1) {
          var targetCoverEl = coverEls[c];
          if (!targetCoverEl || targetCoverEl.dataset.hasDirectCover === "1") continue;
          var x = (gridX + (c % layout.columns) * (cellWidth + gapX)) * scale;
          var y = (gridY + Math.floor(c / layout.columns) * (cellHeight + gapY)) * scale;
          ctx.clearRect(0, 0, outW, outH);
          ctx.drawImage(imgEl, x, y, outW, outH, 0, 0, outW, outH);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.92);
          var croppedImg = document.createElement("img");
          croppedImg.src = dataUrl;
          croppedImg.alt = "";
          targetCoverEl.appendChild(croppedImg);
        }
      } catch (_) {}
    }

    function renderManifest(manifest) {
      if (!manifest || !Array.isArray(manifest.w) || manifest.w.length === 0) return;
      var sources = Array.isArray(manifest.s) ? manifest.s : [];
      var works = manifest.w;
      var countLabel = works.length === 1 ? "1 work shared" : (works.length + " works shared");
      statusEl.textContent = countLabel + " · Click any card or title below to open its page.";
      document.getElementById("works-heading").textContent = "Works (" + works.length + ")";

      var grid = document.getElementById("works-grid");
      grid.innerHTML = "";
      var coverEls = [];

      works.forEach(function (w, idx) {
        if (!Array.isArray(w)) return;
        var srcIdx = typeof w[0] === "number" ? w[0] : -1;
        var relUrl = typeof w[1] === "string" ? w[1] : "";
        var title = typeof w[2] === "string" ? w[2].trim() : "";
        if (!title) return;
        var srcEntry = (srcIdx >= 0 && srcIdx < sources.length && Array.isArray(sources[srcIdx])) ? sources[srcIdx] : null;
        var srcName = srcEntry && typeof srcEntry[1] === "string" ? srcEntry[1] : "";
        var href = resolveWorkHref(w[3], relUrl, srcName, title);
        var coverUrl = safeWebUrl(w[4]);

        var item = document.createElement("article");
        item.className = "work-item";

        var pal = PALETTES[idx % PALETTES.length];
        var coverEl = document.createElement("a");
        coverEl.className = "work-cover";
        coverEl.href = href;
        coverEl.target = "_blank";
        coverEl.rel = "noopener noreferrer";
        coverEl.title = title;

        var mono = document.createElement("div");
        mono.className = "work-monogram";
        mono.style.background = pal.bg;
        mono.style.color = pal.fg;
        mono.textContent = monogramFor(title);
        coverEl.appendChild(mono);

        if (coverUrl) {
          var img = document.createElement("img");
          img.src = coverUrl;
          img.alt = "";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          img.onload = function () {
            coverEl.dataset.hasDirectCover = "1";
          };
          img.onerror = function () {
            if (!img.dataset.triedProxy) {
              img.dataset.triedProxy = "1";
              img.src = "https://wsrv.nl/?url=" + encodeURIComponent(coverUrl);
            } else {
              img.remove();
            }
          };
          coverEl.appendChild(img);
        }
        coverEls.push(coverEl);
        item.appendChild(coverEl);

        var meta = document.createElement("div");
        meta.className = "work-meta";
        var link = document.createElement("a");
        link.className = "work-title";
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = title;
        link.title = title;
        meta.appendChild(link);

        if (srcName) {
          var srcEl = document.createElement("span");
          srcEl.className = "work-source";
          srcEl.textContent = srcName;
          meta.appendChild(srcEl);
        }
        item.appendChild(meta);
        grid.appendChild(item);
      });

      document.getElementById("works-section").hidden = false;

      if (collageUrl) {
        var hiddenCollage = new Image();
        hiddenCollage.crossOrigin = "anonymous";
        hiddenCollage.onload = function () {
          cropCoversFromCollage(hiddenCollage, works.length, coverEls);
        };
        hiddenCollage.src = collageUrl;
      }
    }

    async function decodeInlineToken(inlineToken) {
      if (!inlineToken || inlineToken.indexOf("d.") !== 0 || typeof DecompressionStream === "undefined") return null;
      try {
        var b64 = inlineToken.slice(2).replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4 !== 0) b64 += "=";
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        var ds = new DecompressionStream("gzip");
        var writer = ds.writable.getWriter();
        writer.write(bytes).catch(function () {});
        writer.close().catch(function () {});
        var text = await new Response(ds.readable).text();
        return JSON.parse(text);
      } catch (_) {
        return null;
      }
    }

    function extractInlineTokenFromPng(bytes) {
      if (!bytes || bytes.length < 33) return null;
      var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      var offset = 8;
      var decoder = new TextDecoder();
      while (offset + 12 <= bytes.length) {
        var len = view.getUint32(offset, false);
        var type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
        var next = offset + 12 + len;
        if (next > bytes.length) return null;
        if (type === "tEXt") {
          var data = bytes.subarray(offset + 8, offset + 8 + len);
          var sep = data.indexOf(0);
          if (sep > 0 && decoder.decode(data.subarray(0, sep)) === "epigraph-share") {
            return decoder.decode(data.subarray(sep + 1)).trim();
          }
        }
        if (type === "IEND") break;
        offset = next;
      }
      return null;
    }

    (async function () {
      var inline = token.indexOf("d.") === 0 ? token : null;
      var manifest = await decodeInlineToken(inline);
      if (!manifest && collageUrl) {
        try {
          var resp = await fetch(collageUrl);
          if (resp.ok) {
            var buf = new Uint8Array(await resp.arrayBuffer());
            inline = extractInlineTokenFromPng(buf);
            manifest = await decodeInlineToken(inline);
          }
        } catch (_) {}
      }
      if (manifest) renderManifest(manifest);
    })();

    // Attempt to open the installed Epigraph app automatically unless opened via "View list" (view=1).
    if (!viewOnly) {
      setTimeout(function () {
        window.location.href = target;
      }, 80);
    }
  })();
</script>
</body>
</html>
