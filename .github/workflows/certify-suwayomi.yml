name: Certify Suwayomi Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Suwayomi version (for example v2.3.2238)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EPIGRAPH_VERIFICATION_ROOT: ${{ runner.temp }}/epigraph-verification

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record CI retention request
        id: retention
        shell: pwsh
        run: |
          $configured = if ($env:GITHUB_RETENTION_DAYS) { [int]$env:GITHUB_RETENTION_DAYS } else { 30 }
          $days = [Math]::Min(30, $configured)
          "days=$days" >> $env:GITHUB_OUTPUT
          "EPIGRAPH_CI_RETENTION_DAYS=$days" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:EPIGRAPH_VERIFICATION_ROOT | Out-Null
          @{requestedDays=$days;githubConfiguredDays=$configured;localPolicyControlsGitHub=$false} | ConvertTo-Json | Set-Content (Join-Path $env:EPIGRAPH_VERIFICATION_ROOT 'ci-retention.json')

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test certification contract
        run: pnpm test:suwayomi-certification

      - name: Certify release
        run: pnpm certify:suwayomi -- --version "${{ inputs.version }}"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwayomi-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epigraph-verification/
          if-no-files-found: error
          retention-days: ${{ steps.retention.outputs.days || 1 }}
