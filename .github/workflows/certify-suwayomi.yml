name: Certify Suwayomi Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Suwayomi version (for example v2.3.2238)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test certification contract
        run: pnpm test:suwayomi-certification

      - name: Certify release
        run: pnpm certify:suwayomi -- --version "${{ inputs.version }}" --artifact-dir "artifacts/${{ runner.os }}-${{ runner.arch }}"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suwayomi-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/${{ runner.os }}-${{ runner.arch }}/
          if-no-files-found: error
          retention-days: 30
