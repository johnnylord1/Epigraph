name: Build Android

# Builds and checks the Android app in mobile/ on GitHub's servers: migration verification,
# sync tests, unit tests, lint and the dev debug APK, which is kept as a downloadable artifact.
# A manual run with `release` also builds the standard release APKs unsigned; they are signed
# locally with the release key, which never leaves that machine (mobile/docs/RELEASE_SIGNING.md).
# GitHub only reads workflows from this root folder, so mobile/.github is not run.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: Also build the unsigned standard release APKs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: Android gates
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # The hosted runner has 16 GB: Kotlin compiles inside the Gradle JVM (no daemon that outlives
      # a step), two workers at most, and swap absorbs dexing and lint peaks instead of the runner
      # being killed (exit 143).
      - name: Swap
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -m

      - name: Gradle properties for the hosted runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Migrations and sync tests
        run: ./gradlew :data:verifySqlDelightMigration :data:testAndroidHostTest

      - name: App unit tests
        run: ./gradlew :app:testDevDebugUnitTest

      - name: Assemble dev debug
        run: ./gradlew :app:assembleDevDebug

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: epigraph-mobile-dev-debug
          path: mobile/app/build/outputs/apk/dev/debug/app-dev-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Assemble standard release (unsigned)
        if: ${{ inputs.release }}
        run: ./gradlew :app:assembleStandardRelease

      - name: Upload unsigned standard release APKs
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: epigraph-mobile-standard-release-unsigned
          path: mobile/app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Lint runs last, after the APK is kept.
      - name: Lint
        run: ./gradlew :app:lintDevDebug

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            mobile/**/build/reports/tests/
            mobile/**/build/reports/lint-results-*.html
          retention-days: 7
