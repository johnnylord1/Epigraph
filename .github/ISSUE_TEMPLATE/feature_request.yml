name: Feature request
description: Propose a focused improvement to Epigraph
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading or library workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only a visual treatment.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library
        - Browse and sources
        - Comic reader
        - EPUB or PDF reader
        - Downloads
        - Sync and pairing
        - Themes and accessibility
        - Managed runtime
        - Android
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any current workaround or smaller alternative.
  - type: checkboxes
    id: checks
    attributes:
      label: Final check
      options:
        - label: I searched existing issues and the roadmap before submitting.
          required: true
