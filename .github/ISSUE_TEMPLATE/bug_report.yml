name: Bug report
description: Report a reproducible problem in Epigraph
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Epigraph. Remove personal data, tokens, cookies, and profile contents from all attachments.
  - type: input
    id: version
    attributes:
      label: Epigraph version
      description: Find this in Settings or on the release page.
      placeholder: 0.0.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Android
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Include source type, reader type, theme, external server use, and sanitized logs when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
