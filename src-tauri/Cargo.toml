[package]
name = "epigraph"
version = "0.0.2"
edition = "2021"
default-run = "epigraph"

[lib]
name = "epigraph_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "epigraph"
path = "src/main.rs"

[[bin]]
name = "epigraph-syncd"
path = "src/syncd_main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell    = "2"
tauri-plugin-updater  = "2"
tauri-plugin-process  = "2"
tauri-plugin-http     = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
walkdir = "2"
sysinfo = "0.32"
if-addrs = "0.15"
dirs = "5"
tauri-plugin-os = "2.3.2"
rpcdiscord = "0.2.6"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
mdns-sd = "0.19"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["http2", "macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
http-body-util = "0.1"
futures-util = "0.3"
fs2 = "0.4"
rcgen = { version = "0.13", features = ["x509-parser"] }
pem = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rustls = "0.23"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
